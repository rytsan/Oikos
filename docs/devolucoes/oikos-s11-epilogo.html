<h1>OIKOS S11 — Finais & Epílogo · harness de aceite</h1>
<div id="saida">executando…</div>
<div id="resumo"></div>
<script>
/* ===== OIKOS S1 KERNEL — INÍCIO ===== */
(function (global) {
  'use strict';

  // ---------------------------------------------------------------------
  // Constantes canônicas (CONTRATO entre os 13 módulos). Objeto mutável de
  // propósito: o integrador/harness pode sobrescrever TICK_MS ou SAVE_KEY
  // antes de start() e o loop lê os valores a cada uso (regra 5.8).
  // ---------------------------------------------------------------------
  var consts = {
    TILE_W: 64, TILE_H: 32,
    MAP: 56,
    TICK_MS: 2000,
    MAX_TICKS_PER_FRAME: 5,
    ZOOM_MIN: 0.5, ZOOM_MAX: 2.5,
    SAVE_KEY: 'oikos_v1',
    SCHEMA_VERSION: 1
  };

  // ---------------------------------------------------------------------
  // RNG determinístico — mulberry32 + derivação por hash xmur3.
  // NENHUM Math.random em todo o kernel.
  // ---------------------------------------------------------------------
  function xmur3(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // makeRng(seed) -> { seed, f(), i(n), pick(arr), child(label) }
  // DECISÃO: makeRng é exportado — a spec o descreve mas não o lista nas
  // chaves; os módulos precisam dele para criar streams locais.
  function makeRng(seed) {
    var s = seed >>> 0;
    var next = mulberry32(s);                  // estado interno privado
    return {
      seed: s,
      f: function () { return next(); },
      i: function (n) { return Math.floor(next() * n); },
      pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
      // child() deriva da SEED DE CONSTRUÇÃO, nunca do estado corrente: por
      // isso não consome draws do pai e é estável em qualquer momento.
      child: function (label) {
        var h = xmur3(String(label))();
        return makeRng((s ^ h) >>> 0);
      }
    };
  }

  // ---------------------------------------------------------------------
  // Estado central — schema v1 travado (seção 3 da spec).
  // ---------------------------------------------------------------------
  function makeState(seed) {
    var N = consts.MAP * consts.MAP;
    return {
      schemaVersion: consts.SCHEMA_VERSION,
      seed: seed >>> 0,
      year: 0, era: 0, paused: false,
      meters: { knowledge: 0, legitimacy: 50, harmonyAxis: 0 },
      res: { food: 0, wood: 0, stone: 0, copper: 0, iron: 0, coal: 0, gold: 0 },
      tiles: {
        terrain: new Uint8Array(N),
        resource: new Uint8Array(N),
        building: new Uint8Array(N),
        level: new Uint8Array(N),
        owner: new Uint8Array(N),
        pollution: new Float32Array(N)
      },
      geo: {},
      pendulums: {
        main: { u: 0, k: 0.1 }, harvest: { u: 0, k: 0.1 }, economy: { u: 0, k: 0.1 }
      },
      institutions: [],
      chronicle: [],
      clock: { stagnation: 0, decayStage: 0 },
      camera: { x: 0, y: 0, zoom: 1 },
      tool: null, hover: null,
      sim: { pop: 0, jobs: 0, foodProd: 0, housing: 0, tension: 0 }
    };
  }

  // ---------------------------------------------------------------------
  // Barramento de eventos — pub/sub SÍNCRONO, FIFO por ordem de registro.
  // Os nomes do dicionário (seção 5) não precisam de declaração prévia: o
  // bus aceita qualquer string. O kernel só emite 'sim:tick'.
  // ---------------------------------------------------------------------
  var handlers = Object.create(null);
  var bus = {
    on: function (evt, fn) {
      var arr = handlers[evt] || (handlers[evt] = []);
      arr.push(fn);
      return function off() { var i = arr.indexOf(fn); if (i >= 0) arr.splice(i, 1); };
    },
    emit: function (evt, payload) {
      var arr = handlers[evt];
      if (!arr || !arr.length) return;
      // DECISÃO: itera sobre cópia — on/off durante o emit não corrompe a volta.
      var snap = arr.slice();
      for (var i = 0; i < snap.length; i++) {
        try { snap[i](payload); }
        catch (e) { console.error('[OIKOS bus] handler de "' + evt + '" lancou:', e); }
      }
    }
  };

  // ---------------------------------------------------------------------
  // Registro de módulos (regra 5.9).
  // ---------------------------------------------------------------------
  var modules = [];
  var started = false;

  function initModule(m) {
    if (m.ready) return;
    m.ready = true;
    if (!m.init) return;
    try { m.init(); }
    catch (e) { console.error('[OIKOS] init("' + m.name + '") lancou:', e); }
  }

  function use(name, hooks) {
    hooks = hooks || {};
    var m = { name: name, init: hooks.init, update: hooks.update, draw: hooks.draw, ready: false };
    modules.push(m);
    if (started) initModule(m);                // use() após start(): init imediato
  }

  // ---------------------------------------------------------------------
  // Loop — rAF + tick fixo por acumulador.
  // ---------------------------------------------------------------------
  var rafId = 0, lastNow = 0, acc = 0;

  function tick() {
    loop.tickCount++;
    global.OIKOS.state.year++;                 // year++ ANTES do emit (regra 5.9)
    // DECISÃO: ordem do tick = year++ · update dos módulos · emit('sim:tick').
    for (var i = 0; i < modules.length; i++) {
      var m = modules[i];
      if (!m.update) continue;
      try { m.update(); }
      catch (e) { console.error('[OIKOS] update("' + m.name + '") lancou:', e); }
    }
    bus.emit('sim:tick', { year: global.OIKOS.state.year });
  }

  function step(now) {
    rafId = global.requestAnimationFrame(step);
    var dt = now - lastNow; lastNow = now;
    loop.frame++;

    if (!global.OIKOS.state.paused) {
      acc += dt;
      var TICK = consts.TICK_MS;               // leitura viva (regra 5.8)
      var cap = consts.MAX_TICKS_PER_FRAME, n = 0;
      while (acc >= TICK && n < cap) { acc -= TICK; n++; tick(); }
      if (n >= cap) acc = 0;                   // teto atingido: descarta a dívida
    } else {
      acc = 0;                                 // pausa não acumula dívida
    }

    for (var i = 0; i < modules.length; i++) {
      var m = modules[i];
      if (!m.draw) continue;
      try { m.draw(dt); }
      catch (e) { console.error('[OIKOS] draw("' + m.name + '") lancou:', e); }
    }
  }

  var loop = {
    frame: 0,
    tickCount: 0,
    start: function () {
      if (started) return;                     // DECISÃO: start() idempotente
      started = true;
      for (var i = 0; i < modules.length; i++) initModule(modules[i]);
      lastNow = (global.performance && global.performance.now) ? global.performance.now() : Date.now();
      acc = 0;
      rafId = global.requestAnimationFrame(step);
    },
    // Regra 5.7: pause/resume são os ÚNICOS mutadores de state.paused.
    pause: function () { global.OIKOS.state.paused = true; },
    resume: function () { global.OIKOS.state.paused = false; acc = 0; },
    isPaused: function () { return global.OIKOS.state.paused === true; }
  };

  // ---------------------------------------------------------------------
  // Persistência — serializador recursivo ciente de TypedArrays.
  // ---------------------------------------------------------------------
  var TA = {
    Int8Array: Int8Array, Uint8Array: Uint8Array, Uint8ClampedArray: Uint8ClampedArray,
    Int16Array: Int16Array, Uint16Array: Uint16Array,
    Int32Array: Int32Array, Uint32Array: Uint32Array,
    Float32Array: Float32Array, Float64Array: Float64Array
  };

  function enc(v) {
    if (ArrayBuffer.isView(v) && !(v instanceof DataView)) {
      return { __ta: v.constructor.name, v: Array.prototype.slice.call(v) };
    }
    if (Array.isArray(v)) return v.map(enc);
    if (v && typeof v === 'object') {
      var o = {};
      for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) o[k] = enc(v[k]);
      return o;
    }
    return v;
  }
  function dec(v) {
    if (v && typeof v === 'object' && typeof v.__ta === 'string' && Array.isArray(v.v)) {
      var C = TA[v.__ta];
      if (!C) throw new Error('TypedArray desconhecido: ' + v.__ta);
      return C.from(v.v);
    }
    if (Array.isArray(v)) return v.map(dec);
    if (v && typeof v === 'object') {
      var o = {};
      for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) o[k] = dec(v[k]);
      return o;
    }
    return v;
  }

  function serialize(state) { return JSON.stringify(enc(state)); }

  function deserialize(json) {
    try {
      var raw = JSON.parse(json);
      if (!raw || typeof raw !== 'object') return null;
      if (raw.schemaVersion !== consts.SCHEMA_VERSION) return null;   // versão incompatível
      return dec(raw);
    } catch (e) { return null; }
  }

  // LACUNA: a spec exige localStorage, mas alguns navegadores o negam em
  // file://. Fallback em memória mantém save/load funcionais sem lançar.
  var memStore = Object.create(null);
  function store() {
    try {
      if (global.localStorage) { global.localStorage.getItem(consts.SAVE_KEY); return global.localStorage; }
    } catch (e) { /* bloqueado pelo navegador */ }
    return {
      getItem: function (k) { return (k in memStore) ? memStore[k] : null; },
      setItem: function (k, v) { memStore[k] = String(v); }
    };
  }

  function save() {
    try { store().setItem(consts.SAVE_KEY, serialize(global.OIKOS.state)); }
    catch (e) { console.error('[OIKOS] save falhou:', e); }
  }

  function load() {
    var json;
    try { json = store().getItem(consts.SAVE_KEY); }
    catch (e) { return false; }
    if (!json) return false;
    var st = deserialize(json);
    if (!st) return false;                       // estado vigente permanece intocado
    global.OIKOS.state = st;
    global.OIKOS.rng = makeRng(st.seed);         // regra 5.6: rng recriado da seed
    acc = 0;
    loop.pause();                                // regra 5.7: retoma PAUSADO
    return true;
  }

  // Regra 5.6: o rng NÃO é serializado. Após load(), os draws do stream
  // principal recomeçam da seed; o determinismo ESTRUTURAL se preserva
  // porque cada módulo usa rng.child('<label>'), derivado só da seed.
  // LACUNA: seed inicial de boot não especificada — constante fixa
  // (Math.random é proibido).
  var DEFAULT_SEED = 1337;

  function reset(newSeed) {
    // LACUNA: reset() sem argumento não foi especificado — reutiliza a seed atual.
    var s = (newSeed === undefined || newSeed === null)
      ? (global.OIKOS.state ? global.OIKOS.state.seed : DEFAULT_SEED)
      : newSeed;
    global.OIKOS.state = makeState(s);
    global.OIKOS.rng = makeRng(s);
    acc = 0;
  }

  global.OIKOS = {
    consts: consts,
    makeRng: makeRng,
    rng: makeRng(DEFAULT_SEED),
    state: makeState(DEFAULT_SEED),
    makeState: makeState,
    bus: bus,
    use: use,
    loop: loop,
    save: save,
    load: load,
    reset: reset,
    serialize: serialize,
    deserialize: deserialize
  };
})(window);
/* ===== OIKOS S1 KERNEL — FIM ===== */
</script>
<script>
/* ===== OIKOS S2 WORLDGEN — INÍCIO ===== */
(function (global) {
  'use strict';
  var O = global.OIKOS;

  var OCEANO = 0, DOCE = 1, AREIA = 2, GRAMA = 3, FERTIL = 4, FLORESTA = 5, PEDRA = 6, MONTANHA = 7;
  var CACA = 1, PEIXE = 2, COBRE = 3, FERRO = 4, CARVAO = 5;

  // DECISÃO: faixa de borda forçada a oceano — o aceite exige perímetro 100%
  // marítimo em toda seed, e uma máscara radial folgada garante isso por
  // construção, sem depender de sorte do ruído.
  var MARGEM = 3;
  // Nível do mar ADAPTATIVO por quantil em vez de limiar fixo: o aceite
  // "terra >= 900" passa a ser estrutural, não estatístico.
  // Variabilidade (opção B da auditoria): o alvo de terra e a fração de floresta
  // são SORTEADOS por seed, dentro de faixas que preservam os aceites.
  // DECISÃO: o piso do alvo é 1010 e não 950 — o quantil é calculado ANTES de o
  // rio converter terra em água doce, e 60 tiles de folga mantêm o piso real
  // acima de 900 mesmo num rio longo, sem estourar o teto de 1350.
  var TERRA_MIN = 1010, TERRA_MAX = 1350;
  var FLORESTA_MIN = 0.12, FLORESTA_MAX = 0.26;

  function smooth(t) { return t * t * (3 - 2 * t); }

  function malha(rng, n) {
    var g = new Float32Array(n * n);
    for (var i = 0; i < g.length; i++) g[i] = rng.f();
    return { g: g, n: n };
  }

  // amostra bilinear com suavização e wrap toroidal
  function amostra(L, x, y) {
    var n = L.n, fx = x * n, fy = y * n;
    var ix = Math.floor(fx), iy = Math.floor(fy);
    var tx = smooth(fx - ix), ty = smooth(fy - iy);
    var x0 = ((ix % n) + n) % n, y0 = ((iy % n) + n) % n;
    var x1 = (x0 + 1) % n, y1 = (y0 + 1) % n;
    var topo = L.g[y0 * n + x0] + (L.g[y0 * n + x1] - L.g[y0 * n + x0]) * tx;
    var base = L.g[y1 * n + x0] + (L.g[y1 * n + x1] - L.g[y1 * n + x0]) * tx;
    return topo + (base - topo) * ty;
  }

  // fBm de 4 oitavas (malhas 4, 8, 16, 32), amplitude meio a meio
  function fbm(rng, oitavas, base) {
    var Ls = [], n = base;
    for (var i = 0; i < oitavas; i++) { Ls.push(malha(rng, n)); n *= 2; }
    return function (x, y) {
      var amp = 1, soma = 0, norma = 0;
      for (var j = 0; j < Ls.length; j++) { soma += amp * amostra(Ls[j], x, y); norma += amp; amp *= 0.5; }
      return soma / norma;
    };
  }

  // --- rio: descida greedy do pico ao mar -------------------------------
  function proximoLeito(T, e, M, cur, visto) {
    var cx = cur % M, cy = (cur - cx) / M, alvo = -1, menor = e[cur];
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      var nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= M || ny >= M) continue;
      var ni = ny * M + nx;
      if (T[ni] === OCEANO) return { mar: true, i: ni };
      if (visto[ni]) continue;
      if (e[ni] < menor) { menor = e[ni]; alvo = ni; }
    }
    return { mar: false, i: alvo };
  }

  function lago(T, M, cur) {
    var cx = cur % M, cy = (cur - cx) / M, n = 0;
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      var nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= M || ny >= M) continue;
      var ni = ny * M + nx;
      if (T[ni] !== OCEANO && T[ni] !== DOCE) { T[ni] = DOCE; n++; }
    }
    return n;
  }

  function cavarRio(T, e, M) {
    // nascente = ponto mais alto da montanha. Sem montanha não há nascente e a
    // ilha fica sem rio (hasRiver:false) — hidrelétricas somem do menu futuro.
    var pico = -1, melhor = -Infinity;
    for (var i = 0; i < T.length; i++) if (T[i] === MONTANHA && e[i] > melhor) { melhor = e[i]; pico = i; }
    if (pico < 0) return { len: 0, chegou: false };

    var cur = pico, len = 0, chegou = false, passos = 0;
    var visto = new Uint8Array(T.length);
    while (passos++ < T.length) {
      visto[cur] = 1;
      if (T[cur] !== OCEANO && T[cur] !== DOCE) { T[cur] = DOCE; len++; }
      var p = proximoLeito(T, e, M, cur, visto);
      if (p.mar) { chegou = true; break; }
      if (p.i < 0) { len += lago(T, M, cur); break; }   // depressão: vira lago
      cur = p.i;
    }
    return { len: len, chegou: chegou };
  }

  function perto(T, M, raio) {   // marca tiles a até `raio` passos de água doce
    var N = T.length, dist = new Uint8Array(N), fila = [];
    for (var i = 0; i < N; i++) if (T[i] === DOCE) { dist[i] = 1; fila.push(i); }
    for (var d = 1; d <= raio; d++) {
      var prox = [];
      for (var f = 0; f < fila.length; f++) {
        var cur = fila[f], cx = cur % M, cy = (cur - cx) / M;
        for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
          var nx = cx + dx, ny = cy + dy;
          if (nx < 0 || ny < 0 || nx >= M || ny >= M) continue;
          var ni = ny * M + nx;
          if (!dist[ni]) { dist[ni] = 1; prox.push(ni); }
        }
      }
      fila = prox;
    }
    return dist;
  }

  function temTerraAoLado(T, M, i) {
    var cx = i % M, cy = (i - cx) / M;
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      var nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= M || ny >= M) continue;
      if (T[ny * M + nx] >= AREIA) return true;
    }
    return false;
  }

  // generate() — determinística pela seed vigente. Escreve APENAS em
  // state.tiles.{terrain,resource} e em state.geo.
  function generate() {
    var st = O.state, M = O.consts.MAP, N = M * M;
    var T = st.tiles.terrain, R = st.tiles.resource;
    T.fill(OCEANO); R.fill(0);

    // 0. premissas da ilha, sorteadas por seed
    // LACUNA: a carta fixa os streams 'elev', 'fert', 'forest' e 'ore'. A opção B
    // da auditoria exige um sorteio de premissas por seed, então declaro o label
    // novo 'world' em vez de roubar draws de um stream de contrato.
    var rw = O.rng.child('world');
    var terraAlvo = TERRA_MIN + rw.i(TERRA_MAX - TERRA_MIN + 1);
    var florestaFrac = FLORESTA_MIN + rw.f() * (FLORESTA_MAX - FLORESTA_MIN);

    // 1. elevação: fBm 4 oitavas × máscara radial
    var ruidoE = fbm(O.rng.child('elev'), 4, 4);
    var e = new Float32Array(N);
    var c = (M - 1) / 2, raio = (M / 2) - MARGEM;
    for (var y = 0; y < M; y++) for (var x = 0; x < M; x++) {
      var dx = (x - c) / raio, dy = (y - c) / raio;
      var d = Math.sqrt(dx * dx + dy * dy);
      e[y * M + x] = d >= 1 ? 0 : ruidoE(x / M, y / M) * (1 - smooth(d));
    }

    // 2. nível do mar por quantil
    var ord = Float32Array.from(e); ord.sort();
    var alvo = Math.min(terraAlvo, N - 1);
    var mar = ord[N - alvo], maxE = ord[N - 1];
    if (!(mar > 0)) mar = 1e-6;                       // ilha degenerada
    if (!(maxE > mar)) maxE = mar + 1e-6;

    // 3. faixas de terreno por altura normalizada
    var alt = new Float32Array(N), i;
    for (i = 0; i < N; i++) {
      if (e[i] < mar || e[i] <= 0) continue;          // permanece oceano
      var h = (e[i] - mar) / (maxE - mar);
      alt[i] = h;
      T[i] = h < 0.10 ? AREIA : h < 0.70 ? GRAMA : h < 0.88 ? PEDRA : MONTANHA;
    }

    // 4. rio
    var rio = cavarRio(T, e, M);

    // 5. solo fértil: ruído próprio, amplificado na várzea do rio
    var ruidoF = fbm(O.rng.child('fert'), 4, 4);
    var varzea = perto(T, M, 2);
    for (i = 0; i < N; i++) {
      if (T[i] !== GRAMA) continue;
      var f = ruidoF((i % M) / M, Math.floor(i / M) / M) + (varzea[i] ? 0.22 : 0);
      if (f > 0.60) T[i] = FERTIL;
    }

    // 6. floresta: os K tiles de maior ruído entre grama e fértil
    var ruidoV = fbm(O.rng.child('forest'), 4, 4);
    var terra = 0, eleg = [], nota = new Float32Array(N);
    for (i = 0; i < N; i++) {
      if (T[i] >= AREIA) terra++;
      if (T[i] === GRAMA || T[i] === FERTIL) {
        eleg.push(i);
        nota[i] = ruidoV((i % M) / M, Math.floor(i / M) / M);
      }
    }
    eleg.sort(function (a, b) { return (nota[b] - nota[a]) || (a - b); });  // ordem total
    var kF = Math.min(eleg.length, Math.round(florestaFrac * terra));
    for (i = 0; i < kF; i++) T[eleg[i]] = FLORESTA;

    // 7. veios — só em rocha e montanha (emenda da auditoria): "ilha montanhosa
    // = ilha rica em minério" volta a ser premissa que varia entre partidas.
    // DECISÃO: o tipo é estratificado DENTRO da faixa mineira (altura relativa
    // a [0.70, 1.0]). Com os limiares absolutos de antes, todo veio cairia em
    // ferro e cobre/carvão desapareceriam do jogo.
    var ro = O.rng.child('ore');
    var mineral = [];
    for (i = 0; i < N; i++) if (T[i] === PEDRA || T[i] === MONTANHA) mineral.push(i);

  // culpa de quem chama.

      return null;

      case 'verde': return vizinhoTem(x, y, 2, function (t) { return t === FLORESTA || t === FERTIL; });
    }
    return false;
  }

  // canBuild(idOuNome, x, y) -> { ok, motivo }. Nunca lança.
  // O S7 valida o terreno por conta própria: a seção 4.2 não lista Render entre
  // o que um módulo pode consumir, então reusar isZoneable seria dependência
  // fora do contrato.
  function canBuild(ref, x, y) {
    sincronizar();
    var b = typeof ref === 'string' ? null : PORID[ref];
    if (!b) for (var i = 0; i < BUILDINGS.length; i++) if (BUILDINGS[i].nome === ref) b = BUILDINGS[i];
    if (!b) return { ok: false, motivo: 'edificio desconhecido' };
    if (!dentro(x, y) || Math.floor(x) !== x || Math.floor(y) !== y) return { ok: false, motivo: 'fora do mapa' };
    var M = O.consts.MAP, i2 = y * M + x, st = O.state;
    if (st.tiles.terrain[i2] < 2) return { ok: false, motivo: 'agua' };
    if (st.tiles.building[i2] !== 0) return { ok: false, motivo: 'ocupado' };
    // EMENDA v1.13 D44: tile fora da fronteira não é zoneável (spec S9). Lemos
    // tiles.owner DIRETO: a seção 4.2 não permite ao S7 consumir Border. A
    // regra só vale QUANDO a fronteira existe — com owner ainda todo zerado,
    // enforce incondicional deixaria a Casa sem lugar para a primeira obra.
    if (temFronteira() && st.tiles.owner[i2] === 0) return { ok: false, motivo: 'fora da fronteira' };
    if (!condicaoOk(b.onde, x, y)) return { ok: false, motivo: 'condicao ' + b.onde };
    for (var k in b.custo) if (Object.prototype.hasOwnProperty.call(b.custo, k)) {
      if ((st.res[k] || 0) < b.custo[k]) return { ok: false, motivo: 'falta ' + k };
    }
    return { ok: true, motivo: '', b: b };
  }

  function place(ref, x, y) {
    var v = canBuild(ref, x, y);
    if (!v.ok) return null;
    var M = O.consts.MAP, i2 = y * M + x, st = O.state;
    for (var k in v.b.custo) if (Object.prototype.hasOwnProperty.call(v.b.custo, k)) st.res[k] -= v.b.custo[k];
    st.tiles.building[i2] = v.b.id;
    st.tiles.level[i2] = 1;
    // EMENDA v1.12 D42: payload uniforme { i, x, y, ... } nos dois pontos.
    O.bus.emit('tile:changed', { i: i2, x: x, y: y, building: v.b.id });
    return v.b;
  }

  // Fluxo do ano. A base de CADA número vem no snapshot e passa por Mods.get
  // (D34): nenhum valor é usado sem atravessar o motor.
  function step() {
    sincronizar();
    var st = O.state, M = O.consts.MAP, N = M * M;
    var T = st.tiles.terrain, B = st.tiles.building, L = st.tiles.level, P = st.tiles.pollution;
    var i, x, y, b;

    // --- bruto dos edifícios --------------------------------------------
    var comidaBruta = 0, madeiraBruta = 0, pedraBruta = 0;
    var casasBrutas = 0, vagasBrutas = 0, saberBruto = 0, ativos = 0;
    for (i = 0; i < N; i++) {
      if (!B[i]) continue;
      b = PORID[B[i]];
      if (!b) continue;
      var nivel = L[i] || 1;
      ativos++;
      comidaBruta += b.comida * nivel;
      madeiraBruta += b.madeira * nivel;
      pedraBruta += b.pedra * nivel;
      casasBrutas += b.casas * nivel;
      vagasBrutas += b.vagas * nivel;
      saberBruto += b.saber * nivel;
    }

    var pop = st.sim.pop;
    var snap = {
      pop: pop, ano: st.year, era: st.era, edificios: ativos,
      foodProd: comidaBruta, woodProd: madeiraBruta, stoneProd: pedraBruta,
      foodUse: pop * COMIDA_POR_PESSOA,
      housing: casasBrutas, jobs: vagasBrutas,
      knowledge: saberBruto, tension: 0, growth: 0
    };

    // --- 1. consumo, 2. produção, 3. excedente --------------------------
    var consumo = O.Mods.get('foodUse', snap);
    var comida = O.Mods.get('foodProd', snap);
    var madeira = O.Mods.get('woodProd', snap);
    var pedra = O.Mods.get('stoneProd', snap);
    var excedente = comida - consumo;

    st.res.food = Math.max(0, st.res.food + excedente);
    st.res.wood += madeira;
    st.res.stone += pedra;
    st.sim.foodProd = comida;

    // --- 4. moradia e crescimento logístico -----------------------------
    var moradia = O.Mods.get('housing', snap);
    st.sim.housing = moradia;
    snap.housing = moradia;

    var faminto = (excedente < 0 && st.res.food <= 0);
    if (!faminto && moradia > 0 && pop > 0) {
      snap.growth = CRESCIMENTO_R * pop * (1 - pop / moradia);
      pop = pop + O.Mods.get('growth', snap);
    } else if (!faminto && moradia > 0 && pop <= 0) {
      snap.growth = 1;                      // semente: um acampamento atrai gente
      pop = O.Mods.get('growth', snap);
    }

    // --- 5. empregos -----------------------------------------------------
    st.sim.jobs = O.Mods.get('jobs', snap);

    // --- 6. fome ---------------------------------------------------------
    if (faminto) {
      var perdidos = Math.max(1, Math.floor(pop * FOME_FRACAO));
      pop = Math.max(0, pop - perdidos);
      // DECISÃO: a crônica é por ARESTA — registra quando a fome começa, não a
      // cada ano faminto. Cem entradas iguais afogariam o epílogo (S11), que
      // agrupa por era e lê efeitoMedido.
      if (!emFome) {
        emFome = true;
        O.Chron.log({
          type: 'desastre',
          titulo: 'A fome chega à Casa',
          prosa: 'O celeiro se esvazia e a Casa cobra o preço do que não foi plantado.',
          efeitoMedido: { pop: -perdidos, excedente: Math.round(excedente * 100) / 100 }
        });
      }
    } else if (emFome && excedente >= 0) {
      emFome = false;
    }

    st.sim.pop = Math.max(0, pop);
    snap.pop = st.sim.pop;

    // --- 7. tensão -------------------------------------------------------
    snap.tension = (moradia > 0 ? Math.max(0, st.sim.pop - moradia) / moradia : 0) + (faminto ? 0.5 : 0);
    st.sim.tension = O.Mods.get('tension', snap);

    // --- 8. conhecimento e era ------------------------------------------
    st.meters.knowledge += O.Mods.get('knowledge', snap);
    // EMENDA v1.12 D41: chaveado pela ERA VIGENTE. O booleano só era limpo na
    // troca de identidade do estado, então o portão abria uma vez por sessão e
    // o jogo emperraria na Era 2 — seis eras são a espinha dorsal do design.
    if (eraAnunciada !== st.era && st.meters.knowledge >= LIMIAR_ERA) {
      eraAnunciada = st.era;
      O.bus.emit('era:ready', { era: st.era, knowledge: st.meters.knowledge });
    }

    degradar(comidaBruta, madeiraBruta, ativos);
  }

  // Degradação. O sorteio vem de rng.child('sim.' + ano): child() deriva da
  // seed de CONSTRUÇÃO e não consome o pai, então o mesmo ano dá sempre o mesmo
  // resultado — inclusive depois de um load(), quando o stream principal é
  // recriado. Determinismo estrutural sem guardar estado de rng.
  function degradar(comidaBruta, madeiraBruta, ativos) {
    var st = O.state, M = O.consts.MAP, N = M * M;
    var T = st.tiles.terrain, B = st.tiles.building, P = st.tiles.pollution;
    var r = O.rng.child('sim.' + st.year);
    var i, x, y;

    // poluição: cada edifício suja o próprio tile e o raio 1; tudo decai devagar
    for (i = 0; i < N; i++) P[i] *= POLUICAO_DECAIMENTO;
    for (i = 0; i < N; i++) {
      if (!B[i]) continue;
      x = i % M; y = (i - x) / M;
      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
        var nx = x + dx, ny = y + dy;
        if (!dentro(nx, ny)) continue;
        var ni = ny * M + nx;
        P[ni] = Math.min(1, P[ni] + (dx === 0 && dy === 0 ? 0.04 : 0.015));
      }
    }

    // colheita excessiva consome floresta, e o solo perde fertilidade sob uso
    var pressao = (comidaBruta + madeiraBruta) / 40;
    if (pressao <= 0) return;
    var tentativas = Math.min(6, Math.floor(pressao) + (r.f() < (pressao % 1) ? 1 : 0));
    for (var t = 0; t < tentativas; t++) {
      var alvo = r.i(N);
      // EMENDA v1.12 D42: payload uniforme { i, x, y, ... }.
      // EMENDA v1.12 D43: geo.forestTiles e geo.fertileTiles seguem VIVOS — a S8
      // dimensiona a carta de decisão por state.geo, e congelado no worldgen ele
      // faria a Era 4 decidir sobre a floresta que existia na Era 1.
      var ax = alvo % M, ay = (alvo - ax) / M, g = st.geo;
      if (T[alvo] === FLORESTA) {
        T[alvo] = 3;
        if (g && typeof g.forestTiles === 'number') g.forestTiles--;
        O.bus.emit('tile:changed', { i: alvo, x: ax, y: ay, terrain: 3 });
      } else if (T[alvo] === FERTIL && r.f() < 0.35) {
        T[alvo] = 3;
        if (g && typeof g.fertileTiles === 'number') g.fertileTiles--;
        O.bus.emit('tile:changed', { i: alvo, x: ax, y: ay, terrain: 3 });
      }
    }
  }

  O.use('Sim', { update: step });

  O.Sim = { BUILDINGS: BUILDINGS, canBuild: canBuild, place: place, step: step };
})(window);
/* ===== OIKOS S7 SIM — FIM ===== */
</script>

    });
    O.bus.emit('inst:adopted', { id: inst.id, era: O.state.era, ato: ato && ato.id });

    // DECISÃO: a adoção CONSOME conhecimento (ver CUSTO_CONHECIMENTO). Sem
    // isso o era:ready da era seguinte dispararia no mesmo instante, porque o
    // limiar do S7 é fixo e o conhecimento já está acima dele.
    O.state.meters.knowledge = Math.max(0, O.state.meters.knowledge - CUSTO_CONHECIMENTO);

    var de = O.state.era;
    if (de < ERAS.length - 1) O.state.era = de + 1;
    O.bus.emit('decision:closed', { era: de, adotada: inst.id });
    O.bus.emit('era:advanced', { de: de, para: O.state.era });
    return inst;
  }

  // reform(idVelho, idNovo) — paga legitimidade pelo custo e troca.
  function reform(idVelho, idNovo) {
    sincronizar();
    var velho = PORID[idVelho], novo = PORID[idNovo];
    if (!velho || !novo) { console.error('[OIKOS Eras] reforma com id desconhecido'); return null; }
    if (!jaAdotada(idVelho)) { console.error('[OIKOS Eras] não vigente:', idVelho); return null; }
    if (jaAdotada(idNovo)) { console.error('[OIKOS Eras] já vigente:', idNovo); return null; }
    var custo = custoReforma(idVelho);
    if (!isFinite(custo)) return null;
    if (O.state.meters.legitimacy < custo / 10) {
      console.error('[OIKOS Eras] legitimidade insuficiente para reformar', idVelho);
      return null;
    }

    O.Mods.removeBySource(idVelho);
    var v = O.state.institutions;
    for (var i = v.length - 1; i >= 0; i--) if (v[i] && v[i].id === idVelho) v.splice(i, 1);

    v.push({ id: novo.id, yearAdopted: O.state.year });
    empurrarMods(novo);
    O.state.meters.legitimacy = Math.max(0, O.state.meters.legitimacy - custo / 10);

    O.Chron.log({
      type: 'ato', titulo: 'Reforma: ' + velho.titulo + ' dá lugar a ' + novo.titulo,
      prosa: 'A Casa desfaz o que jurou, e o preço da palavra rompida é a confiança.',
      efeitoMedido: { custo: Math.round(custo * 100) / 100, idade: O.state.year }
    });
    O.bus.emit('inst:reformed', { de: idVelho, para: idNovo, custo: custo });
    return novo;
  }

  // A transição nasce do era:ready do S7. Escuta pelo bus, nunca por update().
  O.bus.on('era:ready', function () {
    sincronizar();
    abrirDecisao();
  });

  // Ciclo de vida leve. O update roda sincronizar() a cada tick — e isso NÃO é
  // luxo: depois de um load() a closure do Mods está zerada (D37) e ninguém
  // mais chamaria o S8 para re-registrar, porque Mods.get não nos aciona. Com
  // o update, o primeiro tick após o load repõe os modificadores. O custo é
  // uma comparação de referência por ano.
  O.use('Eras', { init: sincronizar, update: sincronizar });

  O.Eras = {
    ERAS: ERAS, INSTITUTIONS: INSTITUTIONS,
    opcoes: opcoes, adopt: adopt, reform: reform,
    custoReforma: custoReforma, vigentes: vigentes
  };
})(window);
/* ===== OIKOS S8 ERAS — FIM ===== */
</script>
<script>
/* ===== OIKOS S9 BORDER — INÍCIO ===== */
(function (global) {
  'use strict';
  var O = global.OIKOS;

  var OCEANO = 0, DOCE = 1, FERTIL = 4, FLORESTA = 5, PEDRA = 6, MONTANHA = 7;

  // LACUNA: a carta não fixa a superfície de export do S9. Exporto a consulta
  // de fronteira, o passo orgânico, o decreto com seu custo e o imposto — o
  // mínimo que a S12 precisa para overlay e decreto, e o harness para provar
  // o aceite sem UI.

  // DECISÃO: tiles.owner usa 1 = DENTRO da fronteira e 0 = fora. O S3 já
  // desenha contorno em todo tile com owner !== 0 (vi o bloco do Render no
  // runtime), então qualquer outra semântica faria o mapa desenhar errado sem
  // ninguém reclamar. Valores >1 ficam livres para donos futuros.
  var DENTRO = 1;

  var CUSTO_BASE_DECRETO = 12;      // ouro no tile adjacente à fronteira
  var CUSTO_POR_DISTANCIA = 0.8;    // cresce com a distância ao centro
  var LEGIT_POR_DECRETO = 0.5;
  var RAIO_IMPOSTO = 12;            // c de imposto × 1/(1+dist/c)

  var ultimoState = null;
  function sincronizar() {
    if (O.state === ultimoState) return;
    ultimoState = O.state;
  }

  function dentroMapa(x, y) {
    var M = O.consts.MAP;
    return x >= 0 && y >= 0 && x < M && y < M;
  }

  function isInside(x, y) {
    sincronizar();
    if (!dentroMapa(x, y) || Math.floor(x) !== x || Math.floor(y) !== y) return false;
    return O.state.tiles.owner[y * O.consts.MAP + x] !== 0;
  }

  // Centro da Casa: centroide dos tiles com dono; sem fronteira ainda, o
  // centroide dos edifícios; sem nada, o meio do mapa.
  function centro() {
    sincronizar();
    var M = O.consts.MAP, N = M * M, OWN = O.state.tiles.owner, B = O.state.tiles.building;
    var sx = 0, sy = 0, n = 0, i, x, y;
    for (i = 0; i < N; i++) if (OWN[i]) { x = i % M; y = (i - x) / M; sx += x; sy += y; n++; }
    if (!n) for (i = 0; i < N; i++) if (B[i]) { x = i % M; y = (i - x) / M; sx += x; sy += y; n++; }
    if (!n) return { x: (M - 1) / 2, y: (M - 1) / 2 };
    return { x: sx / n, y: sy / n };
  }

  function distDoCentro(x, y) {
    var c = centro(), dx = x - c.x, dy = y - c.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // Atratividade: água e solo fértil puxam a Casa; montanha repele.
  function atratividade(i) {
    var M = O.consts.MAP, T = O.state.tiles.terrain;
    var x = i % M, y = (i - x) / M, s = 1;
    if (T[i] === FERTIL) s += 3;
    else if (T[i] === FLORESTA) s += 1.5;
    else if (T[i] === MONTANHA) s -= 1.5;
    else if (T[i] === PEDRA) s += 0.5;
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      var nx = x + dx, ny = y + dy;
      if (!dentroMapa(nx, ny)) continue;
      var t = T[ny * M + nx];
      if (t === DOCE) s += 2;
      else if (t === OCEANO) s += 0.75;
    }
    return s - distDoCentro(x, y) * 0.05;
  }

  // DECISÃO: a instituição vigente escolhe o modo. 'inst.terraComum' libera a
  // fronteira orgânica (grátis, sem controle); 'inst.chefiaAloca' a trava e só
  // o decreto expande. Sem instituição adotada, o padrão é orgânico — a Casa
  // do paleolítico se espalha sozinha. A S8 roda em paralelo nesta rodada, e
  // por isso leio state.institutions em vez de depender do código dela.
  function modo() {
    var v = O.state.institutions || [];
    for (var i = 0; i < v.length; i++) {
      if (v[i] && v[i].id === 'inst.chefiaAloca') return 'decreto';
      if (v[i] && v[i].id === 'inst.terraComum') return 'organica';
    }
    return 'organica';
  }

  // Raio orgânico = f(pop, contentamento). Contentamento é o inverso da
  // tensão que o S7 calcula.
  function raioOrganico() {
    var st = O.state;
    var contentamento = Math.max(0, 1 - (st.sim.tension || 0));
    return Math.sqrt(Math.max(0, st.sim.pop)) * (0.6 + 0.6 * contentamento);
  }

  // expandir() — um passo orgânico. Toma os tiles de terra na borda da
  // fronteira, ordenados por atratividade, dentro do raio. Determinístico:
  // a ordenação decide, sem sorteio.
  function expandir() {
    sincronizar();
    if (modo() !== 'organica') return 0;
    var M = O.consts.MAP, N = M * M;
    var T = O.state.tiles.terrain, OWN = O.state.tiles.owner;
    var raio = raioOrganico(), c = centro(), i, x, y;

    var semente = 0;
    for (i = 0; i < N; i++) if (OWN[i]) { semente = 1; break; }
    var cand = [];
    for (i = 0; i < N; i++) {
      if (OWN[i] || T[i] < 2) continue;                 // já é nosso, ou é água
      x = i % M; y = (i - x) / M;
      if (distDoCentro(x, y) > raio) continue;
      if (semente && !vizinhoDaFronteira(x, y)) continue;  // contiguidade
      cand.push(i);
    }
    if (!cand.length) return 0;
    cand.sort(function (a, b) { return atratividade(b) - atratividade(a) || a - b; });

    var quantos = Math.min(cand.length, Math.max(1, Math.floor(raio / 3)));
    for (i = 0; i < quantos; i++) OWN[cand[i]] = DENTRO;
    O.bus.emit('border:changed', { ganhos: quantos, modo: 'organica', total: contarDonos() });
    return quantos;
  }

  function vizinhoDaFronteira(x, y) {
    var M = O.consts.MAP, OWN = O.state.tiles.owner;
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      var nx = x + dx, ny = y + dy;
      if (!dentroMapa(nx, ny)) continue;
      if (OWN[ny * M + nx]) return true;
    }
    return false;
  }

  function contarDonos() {
    var OWN = O.state.tiles.owner, n = 0;
    for (var i = 0; i < OWN.length; i++) if (OWN[i]) n++;
    return n;
  }

  // custoDecreto — cresce com a distância ao centro; montanha custa o dobro.
  function custoDecreto(x, y) {
    sincronizar();
    if (!dentroMapa(x, y)) return Infinity;
    var M = O.consts.MAP, i = y * M + x, T = O.state.tiles.terrain;
    if (T[i] < 2) return Infinity;                       // água não se decreta
    if (O.state.tiles.owner[i]) return 0;                // já é nosso
    var custo = CUSTO_BASE_DECRETO + distDoCentro(x, y) * CUSTO_POR_DISTANCIA;
    if (T[i] === MONTANHA) custo *= 2;
    return custo;
  }

  // decretar(x,y) — paga ouro e legitimidade. Recusa vira ui:toast.
  function decretar(x, y) {
    sincronizar();
    var custo = custoDecreto(x, y);
    if (!isFinite(custo)) {
      O.bus.emit('ui:toast', { tipo: 'recusa', texto: 'A Casa não se estende sobre a água.' });
      return false;
    }
    var M = O.consts.MAP, i = y * M + x;
    if (O.state.tiles.owner[i]) return true;
    if (O.state.res.gold < custo) {
      O.bus.emit('ui:toast', { tipo: 'recusa', texto: 'Não há ouro para estender a fronteira até ali.' });
      return false;
    }
    O.state.res.gold -= custo;
    O.state.meters.legitimacy = Math.max(0, O.state.meters.legitimacy - LEGIT_POR_DECRETO);
    O.state.tiles.owner[i] = DENTRO;
    O.bus.emit('border:changed', { ganhos: 1, modo: 'decreto', total: contarDonos(), custo: custo });
    return true;
  }

  // imposto() — tiles distantes rendem menos: soma de 1/(1+dist/c).
  // A tensão de governar longe NÃO é escrita no estado: vira um mod contra o
  // alvo 'tension' (D39), que é por onde o S7 lê todo número.
  function imposto() {
    sincronizar();
    var M = O.consts.MAP, N = M * M, OWN = O.state.tiles.owner;
    var total = 0, n = 0, distMedia = 0, i, x, y;
    for (i = 0; i < N; i++) {
      if (!OWN[i]) continue;
      x = i % M; y = (i - x) / M;
      var d = distDoCentro(x, y);
      total += 1 / (1 + d / RAIO_IMPOSTO);
      distMedia += d; n++;
    }
    if (n) distMedia /= n;
    var perda = n ? (n - total) / n : 0;                 // quanto se perde na distância
    O.Mods.push({
      id: 'border.tensao', source: 'border', target: 'tension',
      kind: 'add', value: perda * 0.5
    });
    return { rendimento: total, tiles: n, distMedia: distMedia, perda: perda };
  }

  // Um passo por ano: expande organicamente e reavalia o imposto.
  function passo() {
    sincronizar();
    expandir();
    imposto();
  }

  O.use('Border', { update: passo });

  O.Border = {
    isInside: isInside, expandir: expandir, decretar: decretar,
    custoDecreto: custoDecreto, imposto: imposto, centro: centro
  };
})(window);
/* ===== OIKOS S9 BORDER — FIM ===== */
</script>
<script>
/* ===== OIKOS S11 EPILOGUE — INÍCIO ===== */
(function (global) {
  'use strict';
  var O = global.OIKOS;

  // LACUNA: a carta não fixa a superfície de export do S11. Exporto o
  // julgamento do desfecho e o gerador de texto — o mínimo para a S12 exibir
  // e para o harness provar que partidas diferentes geram epílogos diferentes.
  // O S11 devolve STRING: quem desenha é a S12.

  var ERAS = ['Pedra Lascada', 'Semeadura', 'Primeiro Metal',
              'Engrenagens', 'Vapor', 'Contemporânea'];

  function num(v, def) { v = Number(v); return isFinite(v) ? v : (def || 0); }
  function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }
  function conta(s) { return s.trim().split(/\s+/).length; }

  // Enchimento em blocos, consumido só até o piso de 300 palavras. Não inventa
  // fato algum: fala do que a crônica NÃO registrou, que é verdade em qualquer
  // partida.
  var ENCHIMENTO = [
    'O resto é o que não foi dito. A Casa guarda silêncio sobre os anos em que nada pareceu ' +
    'acontecer, e são justamente esses que a formaram: o dia sem colheita, a lei que não se ' +
    'adotou, a árvore que ninguém derrubou porque ninguém teve pressa naquela manhã.',

    'Nenhuma crônica registra o que se absteve de fazer, e ainda assim é disso que uma Casa é ' +
    'feita — das escolhas que couberam e das que passaram longe, sem pedir licença nem deixar ' +
    'marca no chão. O que não foi construído também ocupa lugar.',

    'Houve invernos em que a única decisão foi esperar, e esperar é decisão. Houve verões em ' +
    'que a abundância pareceu promessa, e promessa não é contrato. A ilha assistiu a tudo com ' +
    'a paciência de quem já viu mares subirem e descerem sobre a mesma pedra.',

    'Quem vier depois lerá estas linhas e verá uma ilha; quem viveu aqui viu uma vida. As duas ' +
    'leituras são honestas, e nenhuma delas é completa. A Casa não se explica: ela permanece, ' +
    'ou deixa de permanecer, e ambos os fins dizem a mesma coisa sobre quem a habitou.',

    'Do alto, o que resta parece pequeno. De perto, foi tudo o que houve. Entre as duas ' +
    'distâncias mora a única medida que a Casa aceita: o tempo que levou até aqui, e o que ' +
    'escolheu fazer com ele enquanto durava.'
  ];

  function poluicaoMedia() {
    var P = O.state.tiles.pollution, n = 0, s = 0;
    for (var i = 0; i < P.length; i++) if (P[i] > 0) { s += P[i]; n++; }
    return n ? s / n : 0;
  }
  function contaRuinas() {
    var B = O.state.tiles.building, n = 0;
    // LACUNA: leio O.Decay.RUINA, e a seção 4.2 NÃO lista Decay entre o que um
    // módulo pode consumir. O fecho do epílogo precisa contar ruínas, o schema
    // v1 não tem campo de ruína, e o id é convenção entre S10 e S11 — sem ler
    // o módulo, restaria cravar 200 aqui e torcer para a S10 nunca mudar.
    // Escolho a forma que acompanha a S10, com queda para o 200 conhecido, e
    // DECLARO a dependência: ou a 4.2 se estende, ou o id de ruína vira
    // constante do núcleo canônico. Decisão do dono.
    var r = (O.Decay && O.Decay.RUINA) || 200;
    for (var i = 0; i < B.length; i++) if (B[i] === r) n++;
    return n;
  }

  // desfecho() — avalia harmonia, população e decadência.
  function desfecho() {
    var st = O.state;
    var pop = num(st.sim.pop), decay = num(st.clock && st.clock.decayStage);
    var harm = num(st.meters.harmonyAxis);
    var ruinas = contaRuinas();

    if (pop <= 0 || ruinas > 0 && pop <= 0) return { id: 'colapso', titulo: 'Colapso' };
    if (decay >= 2) return { id: 'cicatrizada', titulo: 'A Casa cicatrizada' };
    if (decay === 1 || poluicaoMedia() > 0.4) return { id: 'cicatrizada', titulo: 'A Casa cicatrizada' };
    // Florescimento em três variantes, pelo eixo de harmonia
    if (harm > 25) return { id: 'florescimento.harmonia', titulo: 'Florescimento — a Casa em concerto' };
    if (harm < -25) return { id: 'florescimento.potencia', titulo: 'Florescimento — a Casa que se impôs' };
    return { id: 'florescimento.equilibrio', titulo: 'Florescimento — a Casa em equilíbrio' };
  }

  // Junta as consequências ao ato que as gerou (D22): a sonda do S6 grava
  // 'consequencia' com refs:[source] E ato:source, e a S8 registra a adoção
  // como 'ato'. É esse par que vira "decidiu X, e colheu Y".
  function vinculos(tl) {
    var atos = {}, out = [];
    var i, e;
    for (i = 0; i < tl.length; i++) { e = tl[i]; if (e.type === 'ato') atos[e.id] = { ato: e, cons: [] }; }
    for (i = 0; i < tl.length; i++) {
      e = tl[i];
      if (e.type !== 'consequencia') continue;
      var alvo = e.ato || (Array.isArray(e.refs) && e.refs[0]);
      if (alvo && atos[alvo]) atos[alvo].cons.push(e);
    }
    for (var k in atos) if (Object.prototype.hasOwnProperty.call(atos, k)) out.push(atos[k]);
    return out;
  }

  function frase(e) {
    var t = (e && typeof e.titulo === 'string' && e.titulo) ? e.titulo : 'um gesto sem nome';
    return t.charAt(0).toLowerCase() + t.slice(1);
  }

  function medida(e) {
    var m = e && e.efeitoMedido;
    if (!m || typeof m !== 'object') return '';
    var partes = [];
    for (var k in m) {
      if (!Object.prototype.hasOwnProperty.call(m, k)) continue;
      var v = m[k];
      if (typeof v === 'number' && isFinite(v)) partes.push(k + ' ' + (v > 0 ? '+' : '') + (Math.round(v * 100) / 100));
      else if (typeof v === 'string' && v) partes.push(v);
      if (partes.length >= 2) break;
    }
    return partes.length ? ' (' + partes.join(', ') + ')' : '';
  }

  // gerar() — 300 a 500 palavras, tom mítico-poético, sem placeholder algum.
  function gerar() {
    var st = O.state;
    var tl = O.Chron.timeline();
    var d = desfecho();
    var g = st.geo || {};
    var terra = num(g.landTiles), floresta = num(g.forestTiles);
    var pol = poluicaoMedia(), ruinas = contaRuinas();
    var anos = num(st.year), pop = Math.round(num(st.sim.pop));

    var p = [];
    p.push('A Casa levou ' + anos + (anos === 1 ? ' ano' : ' anos') +
      ' para chegar até aqui. O que segue não é louvor nem sentença: é o que ficou escrito.');

    // Por era
    var porEra = {}, i, e;
    for (i = 0; i < tl.length; i++) {
      e = tl[i];
      var era = num(e.era);
      (porEra[era] = porEra[era] || []).push(e);
    }
    var erasVistas = Object.keys(porEra).sort(function (a, b) { return a - b; });
    for (i = 0; i < erasVistas.length; i++) {
      var idx = num(erasVistas[i]);
      var nome = ERAS[idx] || ('Era ' + idx);
      var lista = porEra[erasVistas[i]];
      var marcos = lista.filter(function (x) { return x.type === 'ato' || x.type === 'marco'; });
      var males = lista.filter(function (x) { return x.type === 'desastre'; });
      var linha = 'Na ' + nome + ', a Casa registrou ' + lista.length +
        (lista.length === 1 ? ' feito' : ' feitos') + '.';
      if (marcos.length) linha += ' Decidiu por ' + frase(marcos[0]) + medida(marcos[0]) + '.';
      if (males.length) linha += ' E aprendeu, quando ' + frase(males[0]) + medida(males[0]) + '.';
      p.push(linha);
    }
    if (!erasVistas.length) {
      p.push('Nenhuma era chegou a deixar marca: a Casa mal teve tempo de aprender o próprio nome, ' +
        'e o silêncio também é um registro.');
    }

    // Vínculos ato -> consequência (D22): a espinha dorsal do epílogo
    var vs = vinculos(tl).filter(function (v) { return v.cons.length; });
    if (vs.length) {
      for (i = 0; i < Math.min(3, vs.length); i++) {
        p.push('Quando a Casa escolheu ' + frase(vs[i].ato) + ', não sabia que colheria ' +
          frase(vs[i].cons[0]) + medida(vs[i].cons[0]) + '. Toda lei é uma promessa feita ao escuro.');
      }
    } else {
      p.push('Nenhuma decisão chegou a cobrar seu preço por inteiro — a Casa foi poupada ' +
        'de ver o fim dos próprios gestos, o que não é o mesmo que ter acertado.');
    }

    // Fecho material
    var fecho = 'Ao fim, restam ' + terra + ' tiles de terra, ' + floresta +
      ' ainda de floresta — ' + pct(floresta, terra) + '% do que a Casa pisou.';
    fecho += ' A poluição média assentou em ' + (Math.round(pol * 1000) / 1000) + '.';
    fecho += ruinas > 0
      ? ' E ' + ruinas + (ruinas === 1 ? ' ruína permanece' : ' ruínas permanecem') +
        ', que o tempo não desfaz e a próxima Casa herdará.'
      : ' Nenhuma ruína ficou: o que foi levantado seguiu de pé.';
    p.push(fecho);

    p.push(pop > 0
      ? 'Ficaram ' + pop + (pop === 1 ? ' pessoa' : ' pessoas') + ' sobre este chão. ' +
        'A ilha é finita, e foi ela quem julgou.'
      : 'Não ficou ninguém. A ilha é finita, e foi ela quem julgou.');

    p.push('— ' + d.titulo + ' —');

    var texto = p.join('\n\n');
    // O aceite exige que NENHUM placeholder vaze, inclusive no degenerado.
    texto = texto.replace(/undefined|NaN|\[object Object\]|\{\{[^}]*\}\}/g, 'o que não se soube');

    // Piso de 300 palavras sem inventar fato: a Casa fala do que não houve.
    // O enchimento é dimensionado pela NECESSIDADE, não por um bloco fixo —
    // um parágrafo único de tamanho chutado deixava o texto em 234 palavras.
    var i2 = 0;
    while (conta(texto) < 300 && i2 < ENCHIMENTO.length) texto += '\n\n' + ENCHIMENTO[i2++];

    // Teto de 500: parágrafos do meio saem primeiro, preservando a abertura e
    // o fecho material, que são os que carregam número real.
    var ps = texto.split('\n\n');
    while (conta(ps.join('\n\n')) > 500 && ps.length > 4) ps.splice(Math.floor(ps.length / 2), 1);
    texto = ps.join('\n\n');

    return texto;
  }

  function palavras() { return conta(gerar()); }

  O.Epilogue = { gerar: gerar, desfecho: desfecho, palavras: palavras };
})(window);
/* ===== OIKOS S11 EPILOGUE — FIM ===== */
</script>
<script>
/* ================== HARNESS S11 — critérios de aceite ================== */
(function () {
  'use strict';
  var O = window.OIKOS, E = O.Epilogue, res = [];
  function t(id, nome, ok, det) { res.push({ id: id, nome: nome, ok: !!ok, det: det || '', skip: false }); }
  function palavras(s) { return s.trim().split(/\s+/).length; }
  var LIXO = /undefined|NaN|\[object Object\]|\{\{|\}\}/;

  // As sondas do S6 são VOLÁTEIS mas não morrem no reset() — quem registra é
  // que cancela. Sem isto, a segunda corrida da mesma partida rodava com duas
  // sondas e gerava texto diferente, e o teste de estabilidade acusava o
  // harness, não o módulo.
  var sondas = [];
  function limparSondas() {
    for (var i = 0; i < sondas.length; i++) if (sondas[i]) sondas[i].cancel();
    sondas = [];
  }

  // Uma partida com história: instituição adotada, sonda ligada, anos correndo.
  function partidaComHistoria(seed, anos) {
    limparSondas();
    O.reset(seed);
    O.Worldgen.generate();
    O.state.sim.pop = 30;
    O.state.res.wood = 300;
    var M = O.consts.MAP, n = 0;
    for (var y = 0; y < M && n < 3; y++) for (var x = 0; x < M && n < 3; x++) {
      if (O.Sim.place('acampamento', x, y)) n++;
    }
    var ato = O.Eras.adopt('inst.terraComum');
    // A D22 casa a consequência com o ID DA ENTRADA de crônica do ato, não com
    // o id da instituição — é assim que Chron.query({source}) enxerga o par.
    var chave = null;
    var tl = O.Chron.timeline();
    for (var j = 0; j < tl.length; j++) if (tl[j].type === 'ato') chave = tl[j].id;
    sondas.push(O.Chron.probe({
      source: chave || 'c1', every: 7,
      fn: function (ano) { return { titulo: 'a terra comum mostra seu preço no ano ' + ano,
                                    efeitoMedido: { ano: ano } }; }
    }));
    for (var i = 0; i < anos; i++) { O.state.year++; O.Sim.step(); O.bus.emit('sim:tick', { year: O.state.year }); }
    return O.state;
  }

  // ---- 1. desfecho cobre colapso, cicatrizada e as 3 variantes ---------
  (function () {
    var vistos = {};
    O.reset(1); O.Worldgen.generate();
    O.state.sim.pop = 0; vistos.colapso = E.desfecho().id;
    O.state.sim.pop = 50; O.state.clock.decayStage = 2; vistos.cicatrizada = E.desfecho().id;
    O.state.clock.decayStage = 0; O.state.meters.harmonyAxis = 60; vistos.harmonia = E.desfecho().id;
    O.state.meters.harmonyAxis = -60; vistos.potencia = E.desfecho().id;
    O.state.meters.harmonyAxis = 0; vistos.equilibrio = E.desfecho().id;
    var ok = vistos.colapso === 'colapso' && vistos.cicatrizada === 'cicatrizada' &&
      vistos.harmonia === 'florescimento.harmonia' && vistos.potencia === 'florescimento.potencia' &&
      vistos.equilibrio === 'florescimento.equilibrio';
    t(1, 'desfecho(): Colapso, Cicatrizada e Florescimento em três variantes pelo eixo de harmonia',
      ok, JSON.stringify(vistos));
  })();

  // ---- 2. 300 a 500 palavras -------------------------------------------
  (function () {
    partidaComHistoria(42, 60);
    var txt = E.gerar(), n = palavras(txt);
    t(2, 'O epílogo tem entre 300 e 500 palavras', n >= 300 && n <= 500, n + ' palavras');
  })();

  // ---- 3. nenhum placeholder vaza --------------------------------------
  (function () {
    partidaComHistoria(42, 60);
    var txt = E.gerar();
    t(3, 'Nenhum placeholder vaza: sem undefined, NaN, [object Object] ou chaves de template',
      !LIXO.test(txt), LIXO.test(txt) ? 'encontrado: ' + (txt.match(LIXO) || [''])[0] : 'texto limpo');
  })();

  // ---- 4. casos degenerados --------------------------------------------
  (function () {
    var casos = [], limpos = 0, dentroFaixa = 0;
    // crônica vazia, ano 0, sem worldgen
    O.reset(5);
    casos.push(E.gerar());
    // crônica com entrada sem efeitoMedido e sem titulo
    O.reset(6); O.Worldgen.generate();
    O.Chron.log({ type: 'evento' });
    O.Chron.log({ type: 'consequencia', ato: 'c999' });
    casos.push(E.gerar());
    // partida de um ano
    O.reset(7); O.Worldgen.generate(); O.state.year = 1;
    casos.push(E.gerar());
    for (var i = 0; i < casos.length; i++) {
      if (!LIXO.test(casos[i])) limpos++;
      var n = palavras(casos[i]);
      if (n >= 300 && n <= 500) dentroFaixa++;
    }
    t(4, 'Casos degenerados (crônica vazia, campos ausentes, partida de um ano) não vazam lixo nem estouram a faixa',
      limpos === 3 && dentroFaixa === 3,
      'limpos=' + limpos + '/3 · na faixa=' + dentroFaixa + '/3 · palavras=[' +
      casos.map(palavras).join(', ') + ']');
  })();

  // ---- 5. partidas diferentes -> epílogos diferentes -------------------
  (function () {
    partidaComHistoria(42, 60); var a = E.gerar();
    partidaComHistoria(777, 120); var b = E.gerar();
    partidaComHistoria(42, 60); var a2 = E.gerar();
    var diferentes = a !== b;
    var estavel = a === a2;
    // distância grosseira: quantas linhas diferem
    var la = a.split('\n'), lb = b.split('\n'), dif = 0;
    for (var i = 0; i < Math.max(la.length, lb.length); i++) if (la[i] !== lb[i]) dif++;
    t(5, 'Partidas diferentes geram epílogos diferentes, e a mesma partida gera o mesmo texto',
      diferentes && estavel && dif >= 3,
      'diferentes=' + diferentes + ' · estável na mesma partida=' + estavel + ' · linhas distintas=' + dif);
  })();

  // ---- 6. vínculo ato -> consequência aparece no texto (D22) -----------
  (function () {
    partidaComHistoria(42, 80);
    var txt = E.gerar();
    var tl = O.Chron.timeline();
    var temAto = tl.some(function (e) { return e.type === 'ato'; });
    var temCons = tl.some(function (e) { return e.type === 'consequencia' && e.ato; });
    var citaVinculo = /Quando a Casa escolheu .+ colheria /.test(txt);
    t(6, 'O vínculo ato→consequência (D22) aparece no texto: "quando escolheu X, colheria Y"',
      temAto && temCons && citaVinculo,
      'atos na timeline=' + temAto + ' · consequências ligadas=' + temCons + ' · frase de vínculo=' + citaVinculo);
  })();

  // ---- 7. o fecho cita números reais da ilha ---------------------------
  (function () {
    partidaComHistoria(42, 120);
    var g = O.state.geo;
    var txt = E.gerar();
    var citaTerra = txt.indexOf(String(g.landTiles)) >= 0;
    var citaFloresta = txt.indexOf(String(g.forestTiles)) >= 0;
    t(7, 'O fecho é material: cita terra e floresta de state.geo, que a D43 mantém vivo',
      citaTerra && citaFloresta,
      'terra=' + g.landTiles + ' citada=' + citaTerra + ' · floresta=' + g.forestTiles + ' citada=' + citaFloresta);
  })();

  // ---- 8. não toca DOM nem escreve no estado --------------------------
  (function () {
    partidaComHistoria(42, 40);
    var antes = O.serialize(O.state);
    var lancou = false;
    try { E.gerar(); E.desfecho(); E.palavras(); } catch (e) { lancou = true; }
    var depois = O.serialize(O.state);
    t(8, 'gerar() e desfecho() não lançam e não escrevem uma linha no estado',
      !lancou && antes === depois,
      'lançou=' + lancou + ' · estado idêntico=' + (antes === depois));
  })();

  // ---- 9. export --------------------------------------------------------
  (function () {
    var chaves = Object.keys(O.Epilogue).sort().join(',');
    t(9, 'Export { gerar, desfecho, palavras }, tudo função',
      chaves === 'desfecho,gerar,palavras' &&
      Object.keys(O.Epilogue).every(function (k) { return typeof O.Epilogue[k] === 'function'; }),
      '[' + chaves + ']');
  })();

  render(res, 'saida', 'resumo', 'OIKOS S11');

  function render(lista, elTab, elRes, tag) {
    lista.sort(function (a, b) { return a.id - b.id; });
    var linhas = lista.map(function (r) {
      var cls = r.skip ? 'skip' : (r.ok ? 'pass' : 'fail');
      var txt = r.skip ? 'SKIP' : (r.ok ? 'PASS' : 'FAIL');
      return '<tr><td>' + r.id + '</td><td>' + r.nome + '</td><td class="' + cls + '">' + txt +
        '</td><td class="det">' + r.det + '</td></tr>';
    }).join('');
    document.getElementById(elTab).innerHTML =
      '<table><tr><th>#</th><th>Critério</th><th>Status</th><th>Detalhe</th></tr>' + linhas + '</table>';
    var exec = lista.filter(function (r) { return !r.skip; });
    var pass = exec.filter(function (r) { return r.ok; }).length;
    var resumo = pass + '/' + exec.length + ' PASS';
    document.getElementById(elRes).innerHTML =
      '<b class="' + (pass === exec.length ? 'pass' : 'fail') + '">' + resumo + '</b>';
    console.table(lista.map(function (r) {
      return { '#': r.id, criterio: r.nome, status: r.skip ? 'SKIP' : (r.ok ? 'PASS' : 'FAIL'), detalhe: r.det };
    }));
    console.log(tag + ' harness: ' + resumo);
  }
})();
</script>
</body>
</html>
