<script>
/* ===== OIKOS S1 KERNEL — INÍCIO ===== */
(function (global) {
  'use strict';

  // ---------------------------------------------------------------------
  // Constantes canônicas (CONTRATO entre os 13 módulos). Objeto mutável de
  // propósito: o integrador/harness pode sobrescrever TICK_MS ou SAVE_KEY
  // antes de start() e o loop lê os valores a cada uso (regra 5.8).
  // ---------------------------------------------------------------------
  var consts = {
    TILE_W: 64, TILE_H: 32,
    MAP: 56,
    TICK_MS: 2000,
    MAX_TICKS_PER_FRAME: 5,
    ZOOM_MIN: 0.5, ZOOM_MAX: 2.5,
    SAVE_KEY: 'oikos_v1',
    SCHEMA_VERSION: 1
  };

  // ---------------------------------------------------------------------
  // RNG determinístico — mulberry32 + derivação por hash xmur3.
  // NENHUM Math.random em todo o kernel.
  // ---------------------------------------------------------------------
  function xmur3(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // makeRng(seed) -> { seed, f(), i(n), pick(arr), child(label) }
  // DECISÃO: makeRng é exportado — a spec o descreve mas não o lista nas
  // chaves; os módulos precisam dele para criar streams locais.
  function makeRng(seed) {
    var s = seed >>> 0;
    var next = mulberry32(s);                  // estado interno privado
    return {
      seed: s,
      f: function () { return next(); },
      i: function (n) { return Math.floor(next() * n); },
      pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
      // child() deriva da SEED DE CONSTRUÇÃO, nunca do estado corrente: por
      // isso não consome draws do pai e é estável em qualquer momento.
      child: function (label) {
        var h = xmur3(String(label))();
        return makeRng((s ^ h) >>> 0);
      }
    };
  }

  // ---------------------------------------------------------------------
  // Estado central — schema v1 travado (seção 3 da spec).
  // ---------------------------------------------------------------------
  function makeState(seed) {
    var N = consts.MAP * consts.MAP;
    return {
      schemaVersion: consts.SCHEMA_VERSION,
      seed: seed >>> 0,
      year: 0, era: 0, paused: false,
      meters: { knowledge: 0, legitimacy: 50, harmonyAxis: 0 },
      res: { food: 0, wood: 0, stone: 0, copper: 0, iron: 0, coal: 0, gold: 0 },
      tiles: {
        terrain: new Uint8Array(N),
        resource: new Uint8Array(N),
        building: new Uint8Array(N),
        level: new Uint8Array(N),
        owner: new Uint8Array(N),
        pollution: new Float32Array(N)
      },
      geo: {},
      pendulums: {
        main: { u: 0, k: 0.1 }, harvest: { u: 0, k: 0.1 }, economy: { u: 0, k: 0.1 }
      },
      institutions: [],
      chronicle: [],
      clock: { stagnation: 0, decayStage: 0 },
      camera: { x: 0, y: 0, zoom: 1 },
      tool: null, hover: null,
      sim: { pop: 0, jobs: 0, foodProd: 0, housing: 0, tension: 0 }
    };
  }

  // ---------------------------------------------------------------------
  // Barramento de eventos — pub/sub SÍNCRONO, FIFO por ordem de registro.
  // Os nomes do dicionário (seção 5) não precisam de declaração prévia: o
  // bus aceita qualquer string. O kernel só emite 'sim:tick'.
  // ---------------------------------------------------------------------
  var handlers = Object.create(null);
  var bus = {
    on: function (evt, fn) {
      var arr = handlers[evt] || (handlers[evt] = []);
      arr.push(fn);
      return function off() { var i = arr.indexOf(fn); if (i >= 0) arr.splice(i, 1); };
    },
    emit: function (evt, payload) {
      var arr = handlers[evt];
      if (!arr || !arr.length) return;
      // DECISÃO: itera sobre cópia — on/off durante o emit não corrompe a volta.
      var snap = arr.slice();
      for (var i = 0; i < snap.length; i++) {
        try { snap[i](payload); }
        catch (e) { console.error('[OIKOS bus] handler de "' + evt + '" lancou:', e); }
      }
    }
  };

  // ---------------------------------------------------------------------
  // Registro de módulos (regra 5.9).
  // ---------------------------------------------------------------------
  var modules = [];
  var started = false;

  function initModule(m) {
    if (m.ready) return;
    m.ready = true;
    if (!m.init) return;
    try { m.init(); }
    catch (e) { console.error('[OIKOS] init("' + m.name + '") lancou:', e); }
  }

  function use(name, hooks) {
    hooks = hooks || {};
    var m = { name: name, init: hooks.init, update: hooks.update, draw: hooks.draw, ready: false };
    modules.push(m);
    if (started) initModule(m);                // use() após start(): init imediato
  }

  // ---------------------------------------------------------------------
  // Loop — rAF + tick fixo por acumulador.
  // ---------------------------------------------------------------------
  var rafId = 0, lastNow = 0, acc = 0;

  function tick() {
    loop.tickCount++;
    global.OIKOS.state.year++;                 // year++ ANTES do emit (regra 5.9)
    // DECISÃO: ordem do tick = year++ · update dos módulos · emit('sim:tick').
    for (var i = 0; i < modules.length; i++) {
      var m = modules[i];
      if (!m.update) continue;
      try { m.update(); }
      catch (e) { console.error('[OIKOS] update("' + m.name + '") lancou:', e); }
    }
    bus.emit('sim:tick', { year: global.OIKOS.state.year });
  }

  function step(now) {
    rafId = global.requestAnimationFrame(step);
    var dt = now - lastNow; lastNow = now;
    loop.frame++;

    if (!global.OIKOS.state.paused) {
      acc += dt;
      var TICK = consts.TICK_MS;               // leitura viva (regra 5.8)
      var cap = consts.MAX_TICKS_PER_FRAME, n = 0;
      while (acc >= TICK && n < cap) { acc -= TICK; n++; tick(); }
      if (n >= cap) acc = 0;                   // teto atingido: descarta a dívida
    } else {
      acc = 0;                                 // pausa não acumula dívida
    }

    for (var i = 0; i < modules.length; i++) {
      var m = modules[i];
      if (!m.draw) continue;
      try { m.draw(dt); }
      catch (e) { console.error('[OIKOS] draw("' + m.name + '") lancou:', e); }
    }
  }

  var loop = {
    frame: 0,
    tickCount: 0,
    start: function () {
      if (started) return;                     // DECISÃO: start() idempotente
      started = true;
      for (var i = 0; i < modules.length; i++) initModule(modules[i]);
      lastNow = (global.performance && global.performance.now) ? global.performance.now() : Date.now();
      acc = 0;
      rafId = global.requestAnimationFrame(step);
    },
    // Regra 5.7: pause/resume são os ÚNICOS mutadores de state.paused.
    pause: function () { global.OIKOS.state.paused = true; },
    resume: function () { global.OIKOS.state.paused = false; acc = 0; },
    isPaused: function () { return global.OIKOS.state.paused === true; }
  };

  // ---------------------------------------------------------------------
  // Persistência — serializador recursivo ciente de TypedArrays.
  // ---------------------------------------------------------------------
  var TA = {
    Int8Array: Int8Array, Uint8Array: Uint8Array, Uint8ClampedArray: Uint8ClampedArray,
    Int16Array: Int16Array, Uint16Array: Uint16Array,
    Int32Array: Int32Array, Uint32Array: Uint32Array,
    Float32Array: Float32Array, Float64Array: Float64Array
  };

  function enc(v) {
    if (ArrayBuffer.isView(v) && !(v instanceof DataView)) {
      return { __ta: v.constructor.name, v: Array.prototype.slice.call(v) };
    }
    if (Array.isArray(v)) return v.map(enc);
    if (v && typeof v === 'object') {
      var o = {};
      for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) o[k] = enc(v[k]);
      return o;
    }
    return v;
  }
  function dec(v) {
    if (v && typeof v === 'object' && typeof v.__ta === 'string' && Array.isArray(v.v)) {
      var C = TA[v.__ta];
      if (!C) throw new Error('TypedArray desconhecido: ' + v.__ta);
      return C.from(v.v);
    }
    if (Array.isArray(v)) return v.map(dec);
    if (v && typeof v === 'object') {
      var o = {};
      for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) o[k] = dec(v[k]);
      return o;
    }
    return v;
  }

  function serialize(state) { return JSON.stringify(enc(state)); }

  function deserialize(json) {
    try {
      var raw = JSON.parse(json);
      if (!raw || typeof raw !== 'object') return null;
      if (raw.schemaVersion !== consts.SCHEMA_VERSION) return null;   // versão incompatível
      return dec(raw);
    } catch (e) { return null; }
  }

  // LACUNA: a spec exige localStorage, mas alguns navegadores o negam em
  // file://. Fallback em memória mantém save/load funcionais sem lançar.
  var memStore = Object.create(null);
  function store() {
    try {
      if (global.localStorage) { global.localStorage.getItem(consts.SAVE_KEY); return global.localStorage; }
    } catch (e) { /* bloqueado pelo navegador */ }
    return {
      getItem: function (k) { return (k in memStore) ? memStore[k] : null; },
      setItem: function (k, v) { memStore[k] = String(v); }
    };
  }

  function save() {
    try { store().setItem(consts.SAVE_KEY, serialize(global.OIKOS.state)); }
    catch (e) { console.error('[OIKOS] save falhou:', e); }
  }

  function load() {
    var json;
    try { json = store().getItem(consts.SAVE_KEY); }
    catch (e) { return false; }
    if (!json) return false;
    var st = deserialize(json);
    if (!st) return false;                       // estado vigente permanece intocado
    global.OIKOS.state = st;
    global.OIKOS.rng = makeRng(st.seed);         // regra 5.6: rng recriado da seed
    acc = 0;
    loop.pause();                                // regra 5.7: retoma PAUSADO
    return true;
  }

  // Regra 5.6: o rng NÃO é serializado. Após load(), os draws do stream
  // principal recomeçam da seed; o determinismo ESTRUTURAL se preserva
  // porque cada módulo usa rng.child('<label>'), derivado só da seed.
  // LACUNA: seed inicial de boot não especificada — constante fixa
  // (Math.random é proibido).
  var DEFAULT_SEED = 1337;

  function reset(newSeed) {
    // LACUNA: reset() sem argumento não foi especificado — reutiliza a seed atual.
    var s = (newSeed === undefined || newSeed === null)
      ? (global.OIKOS.state ? global.OIKOS.state.seed : DEFAULT_SEED)
      : newSeed;
    global.OIKOS.state = makeState(s);
    global.OIKOS.rng = makeRng(s);
    acc = 0;
  }

  global.OIKOS = {
    consts: consts,
    makeRng: makeRng,
    rng: makeRng(DEFAULT_SEED),
    state: makeState(DEFAULT_SEED),
    makeState: makeState,
    bus: bus,
    use: use,
    loop: loop,
    save: save,
    load: load,
    reset: reset,
    serialize: serialize,
    deserialize: deserialize
  };
})(window);
/* ===== OIKOS S1 KERNEL — FIM ===== */
</script>
<script>
/* ===== OIKOS S4 ELLIPTIC — INÍCIO ===== */
(function (global) {
  'use strict';
  var O = global.OIKOS;

  var K_MAX = 0.9999;                       // clamp contratual (seção 6, S4)

  function num(v, def) { v = Number(v); return isFinite(v) ? v : def; }

  // clampK — nunca lança: |k| finito, teto em 0.9999.
  // DECISÃO: k negativo usa |k| (sn/cn/dn dependem só de k²); NaN/∞ viram 0.
  function clampK(k) {
    k = Math.abs(num(k, 0));
    return k > K_MAX ? K_MAX : k;
  }

  // K(k) — integral elíptica completa de 1a espécie, AGM (seção 7 da carta).
  function K(k) {
    k = clampK(k);
    var a = 1, b = Math.sqrt(1 - k * k), t, guard = 0;
    while (Math.abs(a - b) > 1e-14 && guard++ < 64) {
      t = (a + b) / 2; b = Math.sqrt(a * b); a = t;
    }
    return Math.PI / (2 * a);
  }

  // amp(u,k) — amplitude phi pela descida de Landen (seção 7). Base ÚNICA de
  // sn/cn/dn: uma só phi elimina qualquer ramificação de sinal entre as três.
  function amp(u, k) {
    k = clampK(k);
    u = num(u, 0);
    var A = [1], B = [Math.sqrt(1 - k * k)], C = [k];
    while (Math.abs(A[A.length - 1] - B[B.length - 1]) > 1e-13 && C.length < 12) {
      var a = A[A.length - 1], b = B[B.length - 1];
      A.push((a + b) / 2); B.push(Math.sqrt(a * b)); C.push((a - b) / 2);
    }
    var n = C.length - 1;
    var phi = Math.pow(2, n) * A[n] * u;
    for (var i = n; i >= 1; i--) {
      var s = (C[i] / A[i]) * Math.sin(phi);
      if (s > 1) s = 1; else if (s < -1) s = -1;   // arredondamento não vira NaN
      phi = (phi + Math.asin(s)) / 2;
    }
    return phi;
  }

  function sn(u, k) { return Math.sin(amp(u, k)); }
  function cn(u, k) { return Math.cos(amp(u, k)); }
  function dn(u, k) {
    var kk = clampK(k), s = Math.sin(amp(u, kk));
    var v = 1 - kk * kk * s * s;
    return Math.sqrt(v < 0 ? 0 : v);              // v só fica <0 por arredondamento
  }

  // Pendulum — duas formas:
  //   standalone {omega, k, u0} : k CONGELADO na construção, u local
  //   bound      {id, omega}    : lê state.pendulums[id].k VIVO a cada leitura
  //                               e escreve u de volta no estado
  // Nenhuma referência de estado é capturada em closure (reset() reatribui).
  function Pendulum(cfg) {
    cfg = cfg || {};
    var bound = (cfg.id !== undefined && cfg.id !== null);
    var p = { id: bound ? String(cfg.id) : null, bound: bound, omega: num(cfg.omega, 1) };

    function slot() { var ps = O.state.pendulums; return ps ? ps[p.id] : null; }

    if (bound) {
      Object.defineProperty(p, 'u', {
        enumerable: true,
        get: function () { var s = slot(); return s ? num(s.u, 0) : 0; },
        set: function (v) { var s = slot(); if (s) s.u = num(v, 0); }
      });
      Object.defineProperty(p, 'k', {
        enumerable: true,
        get: function () { var s = slot(); return clampK(s ? s.k : 0); }
      });
    } else {
      p.u = num(cfg.u0, 0);
      p.k = clampK(cfg.k);                        // congelado
    }

    Object.defineProperty(p, 'pos', {             // posição = sn(u, k)
      enumerable: true,
      get: function () { return sn(p.u, p.k); }
    });
    // D21: vel = omega·cn(u,k) — a velocidade canônica do pêndulo elíptico
    // (dθ/dt ∝ cn), NÃO a derivada numérica de pos (que seria omega·cn·dn).
    // O contrato fixa esta forma; os testes a tratam como tal.
    Object.defineProperty(p, 'vel', {
      enumerable: true,
      get: function () { return p.omega * cn(p.u, p.k); }
    });

    // step(dt): dt em ANOS, omega em rad/ano.
    p.step = function (dt) { p.u = p.u + p.omega * num(dt, 0); return p.u; };
    // período do movimento: 4·K(k)/omega — diverge quando k → 1.
    p.period = function () { var w = Math.abs(p.omega); return w > 0 ? 4 * K(p.k) / w : Infinity; };
    return p;
  }

  // couple(ps, strength, dt): m = média das posições; cada u é puxado na direção
  // da média. A média é calculada ANTES de qualquer mutação (acoplamento síncrono).
  function couple(ps, strength, dt) {
    if (!ps || !ps.length) return;
    var s = num(strength, 0), d = num(dt, 0), m = 0, i;
    for (i = 0; i < ps.length; i++) m += ps[i].pos;
    m /= ps.length;
    if (!isFinite(m)) return;
    for (i = 0; i < ps.length; i++) {
      var du = s * d * (m - ps[i].pos);
      if (isFinite(du)) ps[i].u = ps[i].u + du;
    }
  }

  // DECISÃO: amp() não é exportada — a carta fixa a superfície em
  // {K, sn, cn, dn, Pendulum, couple} e ampliá-la seria extensão silenciosa.
  O.Elliptic = { K: K, sn: sn, cn: cn, dn: dn, Pendulum: Pendulum, couple: couple };
})(window);
/* ===== OIKOS S4 ELLIPTIC — FIM ===== */
</script>
<script>
/* ================== HARNESS S4 — critérios de aceite ================== */
(function () {
  'use strict';
  var O = window.OIKOS, E = O.Elliptic, res = [];
  function t(id, nome, ok, det) { res.push({ id: id, nome: nome, ok: !!ok, det: det || '' }); }
  var PI2 = Math.PI / 2;

  // 1. sn(u,0) === sin(u)
  (function () {
    var pior = 0;
    for (var u = -12; u <= 12; u += 0.013) pior = Math.max(pior, Math.abs(E.sn(u, 0) - Math.sin(u)));
    t(1, 'sn(u,0) = sin(u) com erro < 1e-9', pior < 1e-9, 'pior erro = ' + pior.toExponential(2));
  })();

  // 2. K(0) = pi/2
  (function () {
    var d = Math.abs(E.K(0) - PI2);
    t(2, 'K(0) = pi/2', d < 1e-14, 'K(0)=' + E.K(0).toFixed(15) + ' erro=' + d.toExponential(2));
  })();

  // 3. K estritamente crescente + divergência quando k -> 1
  (function () {
    var cresce = true, ant = -Infinity;
    for (var k = 0; k < 0.9999; k += 0.0025) {
      var v = E.K(k);
      if (!(v > ant) || !isFinite(v)) cresce = false;
      ant = v;
    }
    var k999 = E.K(0.999), k9999 = E.K(0.9999);
    // LACUNA: a carta pede K(0.999) > 10, alvo inalcançável nesta convenção de
    // módulo — K(k) ~ ln(4/sqrt(1-k^2)) só passa de 10 com k > 1 - 3.3e-8, muito
    // além do clamp 0.9999. Testa-se a divergência real e verificável: K cresce
    // monotonicamente e, no teto do clamp, já vale 3,6× K(0).
    var diverge = (k999 > 4) && (k9999 > k999) && isFinite(k9999) && (k9999 / PI2 > 3.5);
    t(3, 'K estritamente crescente e divergente (ver LACUNA sobre o alvo >10 da carta)',
      cresce && diverge, 'K(0.999)=' + k999.toFixed(4) + ' K(0.9999)=' + k9999.toFixed(4));
  })();

  // 4. Simetrias e identidades pitagóricas
  (function () {
    var okSim = true, okId = true, piorId = 0;
    for (var k = 0; k <= 0.95; k += 0.05) {
      for (var u = -9; u <= 9; u += 0.07) {
        if (Math.abs(E.sn(-u, k) + E.sn(u, k)) > 1e-12) okSim = false;
        if (Math.abs(E.cn(-u, k) - E.cn(u, k)) > 1e-12) okSim = false;
        if (Math.abs(E.dn(-u, k) - E.dn(u, k)) > 1e-12) okSim = false;
        var s = E.sn(u, k), c = E.cn(u, k), d = E.dn(u, k);
        var i1 = Math.abs(s * s + c * c - 1);
        var i2 = Math.abs(d * d + k * k * s * s - 1);
        piorId = Math.max(piorId, i1, i2);
        if (i1 > 1e-12 || i2 > 1e-12) okId = false;
      }
    }
    t(4, 'Simetrias sn(-u)=-sn(u), cn/dn pares; identidades sn^2+cn^2=1 e dn^2+k^2·sn^2=1',
      okSim && okId, 'simetrias=' + okSim + ' pior identidade=' + piorId.toExponential(2));
  })();

  // 5. Periodicidade sn(u + 4K) = sn(u)
  (function () {
    var pior = 0;
    for (var k = 0; k <= 0.9; k += 0.1) {
      var P = 4 * E.K(k);
      for (var u = -3; u <= 3; u += 0.11) pior = Math.max(pior, Math.abs(E.sn(u + P, k) - E.sn(u, k)));
    }
    t(5, 'Periodicidade: sn(u + 4·K(k), k) = sn(u, k)', pior < 1e-8, 'pior erro = ' + pior.toExponential(2));
  })();

  // 6. Performance: 1000 sn
  (function () {
    var t0 = performance.now(), acc = 0;
    for (var i = 0; i < 1000; i++) acc += E.sn(i * 0.01, 0.7);
    var ms = performance.now() - t0;
    t(6, 'Performance: 1000 chamadas de sn em menos de 5 ms', ms < 5 && isFinite(acc), ms.toFixed(3) + ' ms');
  })();

  // 7. couple: sem NaN e estável em 10.000 passos
  (function () {
    O.reset(2024);
    var ps = [
      E.Pendulum({ id: 'main', omega: 0.9 }),
      E.Pendulum({ id: 'harvest', omega: 1.3 }),
      E.Pendulum({ id: 'economy', omega: 0.5 })
    ];
    O.state.pendulums.main.k = 0.3;
    O.state.pendulums.harvest.k = 0.6;
    O.state.pendulums.economy.k = 0.85;
    var ok = true, desvio0 = null, desvioF = null;
    for (var s = 0; s < 10000; s++) {
      for (var i = 0; i < ps.length; i++) ps[i].step(0.05);
      E.couple(ps, 0.4, 0.05);
      for (var j = 0; j < ps.length; j++) {
        if (!isFinite(ps[j].u) || !isFinite(ps[j].pos)) ok = false;
        if (Math.abs(ps[j].pos) > 1.0000001) ok = false;
      }
      if (s === 10) desvio0 = espalhamento(ps);
      if (s === 9999) desvioF = espalhamento(ps);
    }
    function espalhamento(a) {
      var m = 0, i;
      for (i = 0; i < a.length; i++) m += a[i].pos;
      m /= a.length;
      var v = 0;
      for (i = 0; i < a.length; i++) v += (a[i].pos - m) * (a[i].pos - m);
      return Math.sqrt(v / a.length);
    }
    t(7, 'couple: 10.000 passos sem NaN, |pos| <= 1, sistema permanece limitado',
      ok && isFinite(desvioF), 'espalhamento inicial=' + desvio0.toFixed(4) + ' final=' + desvioF.toFixed(4));
  })();

  // 8. Clamp: nunca lança
  (function () {
    var entradas = [1, 1.5, -0.5, -3, NaN, Infinity, -Infinity, undefined, null, '0.5'];
    var ok = true, det = [];
    for (var i = 0; i < entradas.length; i++) {
      try {
        var a = E.K(entradas[i]), b = E.sn(1, entradas[i]), c = E.cn(1, entradas[i]), d = E.dn(1, entradas[i]);
        if (!isFinite(a) || !isFinite(b) || !isFinite(c) || !isFinite(d)) { ok = false; det.push(String(entradas[i])); }
      } catch (e) { ok = false; det.push(String(entradas[i]) + ' lancou'); }
    }
    var teto = Math.abs(E.K(1) - E.K(0.9999)) < 1e-12;
    t(8, 'Clamp k em [0, 0.9999]: entradas inválidas não lançam e não produzem NaN',
      ok && teto, teto ? 'K(1) = K(0.9999) = ' + E.K(1).toFixed(4) : 'falhas: ' + det.join(','));
  })();

  // 9. Pendulum bound: lê k vivo do estado e escreve u de volta
  (function () {
    O.reset(77);
    var p = E.Pendulum({ id: 'main', omega: 1 });
    p.step(0.5);
    var escreveU = Math.abs(O.state.pendulums.main.u - 0.5) < 1e-12;
    O.state.pendulums.main.k = 0.8;
    var leK = Math.abs(p.k - 0.8) < 1e-12;
    var periodoCresce = p.period() > 4 * E.K(0.1);
    var ref = O.state;
    O.reset(77);                                   // reatribui o objeto de estado
    // após reset o slot volta ao padrão do schema ({u:0, k:0.1}) e o pêndulo
    // enxerga o objeto NOVO — prova de que nada ficou preso em closure.
    var sobrevive = (O.state !== ref) && Math.abs(p.k - 0.1) < 1e-12 && p.u === 0;
    t(9, 'Pendulum bound: escreve u no estado, lê k vivo, sobrevive a reset() sem closure presa',
      escreveU && leK && periodoCresce && sobrevive,
      'escreveU=' + escreveU + ' leK=' + leK + ' periodo=' + periodoCresce + ' posReset=' + sobrevive);
  })();

  // 10. Pendulum standalone: k congelado
  (function () {
    O.reset(5);
    var p = E.Pendulum({ omega: 2, k: 0.4, u0: 0.25 });
    var u0 = (p.u === 0.25);
    O.state.pendulums.main.k = 0.99;               // não deve afetar um standalone
    var congelado = Math.abs(p.k - 0.4) < 1e-12;
    p.step(0.5);
    var passo = Math.abs(p.u - 1.25) < 1e-12;
    var naoEscreve = (O.state.pendulums.main.u === 0);
    t(10, 'Pendulum standalone: u0 respeitado, k congelado, não escreve no estado',
      u0 && congelado && passo && naoEscreve,
      'u0=' + u0 + ' kCongelado=' + congelado + ' step=' + passo + ' isolado=' + naoEscreve);
  })();

  // 11. get vel (D21)
  (function () {
    O.reset(11);
    var p = E.Pendulum({ omega: 2.5, k: 0.6, u0: 0 });
    var emZero = Math.abs(p.vel - 2.5) < 1e-12;          // cn(0,k) = 1
    var par = true, limitado = true, finito = true;
    for (var k = 0; k <= 0.99; k += 0.09) {
      var q = E.Pendulum({ omega: 1.7, k: k, u0: 0 });
      for (var u = -8; u <= 8; u += 0.19) {
        q.u = u; var v1 = q.vel;
        q.u = -u; var v2 = q.vel;
        if (Math.abs(v1 - v2) > 1e-12) par = false;      // cn é par
        if (Math.abs(v1) > 1.7 + 1e-12) limitado = false;
        if (!isFinite(v1)) finito = false;
      }
    }
    var b = E.Pendulum({ id: 'main', omega: 3 });         // também no bound
    O.state.pendulums.main.k = 0.5;
    var noBound = Math.abs(b.vel - 3) < 1e-12;
    t(11, 'get vel = omega·cn(u,k): vale omega em u=0, é par, limitado por |omega| e existe no bound',
      emZero && par && limitado && finito && noBound,
      'u=0 -> ' + p.vel.toFixed(3) + ' · par=' + par + ' · limitado=' + limitado + ' · bound=' + noBound);
  })();

  render(res, 'saida', 'resumo', 'OIKOS S4');
  function render(lista, elTab, elRes, tag) {
    lista.sort(function (a, b) { return a.id - b.id; });
    document.getElementById(elTab).innerHTML =
      '<table><tr><th>#</th><th>Critério</th><th>Status</th><th>Detalhe</th></tr>' +
      lista.map(function (r) {
        return '<tr><td>' + r.id + '</td><td>' + r.nome + '</td><td class="' + (r.ok ? 'pass' : 'fail') +
          '">' + (r.ok ? 'PASS' : 'FAIL') + '</td><td class="det">' + r.det + '</td></tr>';
      }).join('') + '</table>';
    var pass = lista.filter(function (r) { return r.ok; }).length;
    document.getElementById(elRes).innerHTML =
      '<b class="' + (pass === lista.length ? 'pass' : 'fail') + '">' + pass + '/' + lista.length + ' PASS</b>';
    console.table(lista.map(function (r) {
      return { '#': r.id, criterio: r.nome, status: r.ok ? 'PASS' : 'FAIL', detalhe: r.det };
    }));
    console.log(tag + ' harness: ' + pass + '/' + lista.length + ' PASS');
  }
})();
</script>
