  td,th{border:1px solid #39414d;padding:4px 10px;text-align:left;vertical-align:top}

<body>
<h1>OIKOS S1 — Kernel · Harness de aceite</h1>
<div id="saida">executando…</div>
<div id="resumo"></div>

<script>
/* ===== OIKOS S1 KERNEL — INÍCIO ===== */
(function (global) {
  'use strict';

  // ---------------------------------------------------------------------
  // Constantes canônicas (CONTRATO entre os 13 módulos). Objeto mutável de
  // propósito: o integrador/harness pode sobrescrever TICK_MS ou SAVE_KEY
  // antes de start() e o loop lê os valores a cada uso (regra 5.8).
  // ---------------------------------------------------------------------
  var consts = {
    TILE_W: 64, TILE_H: 32,
    MAP: 56,
    TICK_MS: 2000,
    MAX_TICKS_PER_FRAME: 5,
    ZOOM_MIN: 0.5, ZOOM_MAX: 2.5,
    SAVE_KEY: 'oikos_v1',
    SCHEMA_VERSION: 1
  };

  // ---------------------------------------------------------------------
  // RNG determinístico — mulberry32 + derivação por hash xmur3.
  // NENHUM Math.random em todo o kernel.
  // ---------------------------------------------------------------------
  function xmur3(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // makeRng(seed) -> { seed, f(), i(n), pick(arr), child(label) }
  // DECISÃO: makeRng é exportado — a spec o descreve mas não o lista nas
  // chaves; os módulos precisam dele para criar streams locais.
  function makeRng(seed) {
    var s = seed >>> 0;
    var next = mulberry32(s);                  // estado interno privado
    return {
      seed: s,
      f: function () { return next(); },
      i: function (n) { return Math.floor(next() * n); },
      pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
      // child() deriva da SEED DE CONSTRUÇÃO, nunca do estado corrente: por
      // isso não consome draws do pai e é estável em qualquer momento.
      child: function (label) {
        var h = xmur3(String(label))();
        return makeRng((s ^ h) >>> 0);
      }
    };
  }

  // ---------------------------------------------------------------------
  // Estado central — schema v1 travado (seção 3 da spec).
  // ---------------------------------------------------------------------
  function makeState(seed) {
    var N = consts.MAP * consts.MAP;
    return {
      schemaVersion: consts.SCHEMA_VERSION,
      seed: seed >>> 0,
      year: 0, era: 0, paused: false,
      meters: { knowledge: 0, legitimacy: 50, harmonyAxis: 0 },
      res: { food: 0, wood: 0, stone: 0, copper: 0, iron: 0, coal: 0, gold: 0 },
      tiles: {
        terrain: new Uint8Array(N),
        resource: new Uint8Array(N),
        building: new Uint8Array(N),
        level: new Uint8Array(N),
        owner: new Uint8Array(N),
        pollution: new Float32Array(N)
      },
      geo: {},
      pendulums: {
        main: { u: 0, k: 0.1 }, harvest: { u: 0, k: 0.1 }, economy: { u: 0, k: 0.1 }
      },
      institutions: [],
      chronicle: [],
      clock: { stagnation: 0, decayStage: 0 },
      camera: { x: 0, y: 0, zoom: 1 },
      tool: null, hover: null,
      sim: { pop: 0, jobs: 0, foodProd: 0, housing: 0, tension: 0 }
    };
  }

  // ---------------------------------------------------------------------
  // Barramento de eventos — pub/sub SÍNCRONO, FIFO por ordem de registro.
  // Os nomes do dicionário (seção 5) não precisam de declaração prévia: o
  // bus aceita qualquer string. O kernel só emite 'sim:tick'.
  // ---------------------------------------------------------------------
  var handlers = Object.create(null);
  var bus = {
    on: function (evt, fn) {
      var arr = handlers[evt] || (handlers[evt] = []);
      arr.push(fn);
      return function off() { var i = arr.indexOf(fn); if (i >= 0) arr.splice(i, 1); };
    },
    emit: function (evt, payload) {
      var arr = handlers[evt];
      if (!arr || !arr.length) return;
      // DECISÃO: itera sobre cópia — on/off durante o emit não corrompe a volta.
      var snap = arr.slice();
      for (var i = 0; i < snap.length; i++) {
        try { snap[i](payload); }
        catch (e) { console.error('[OIKOS bus] handler de "' + evt + '" lancou:', e); }
      }
    }
  };

  // ---------------------------------------------------------------------
  // Registro de módulos (regra 5.9).
  // ---------------------------------------------------------------------
  var modules = [];
  var started = false;

  function initModule(m) {
    if (m.ready) return;
    m.ready = true;
    if (!m.init) return;
    try { m.init(); }
    catch (e) { console.error('[OIKOS] init("' + m.name + '") lancou:', e); }
  }

  function use(name, hooks) {
    hooks = hooks || {};
    var m = { name: name, init: hooks.init, update: hooks.update, draw: hooks.draw, ready: false };
    modules.push(m);
    if (started) initModule(m);                // use() após start(): init imediato
  }

  // ---------------------------------------------------------------------
  // Loop — rAF + tick fixo por acumulador.
  // ---------------------------------------------------------------------
  var rafId = 0, lastNow = 0, acc = 0;

  function tick() {
    loop.tickCount++;
    global.OIKOS.state.year++;                 // year++ ANTES do emit (regra 5.9)
    // DECISÃO: ordem do tick = year++ · update dos módulos · emit('sim:tick').
    for (var i = 0; i < modules.length; i++) {
      var m = modules[i];
      if (!m.update) continue;
      try { m.update(); }
      catch (e) { console.error('[OIKOS] update("' + m.name + '") lancou:', e); }
    }
    bus.emit('sim:tick', { year: global.OIKOS.state.year });
  }

  function step(now) {
    rafId = global.requestAnimationFrame(step);
    var dt = now - lastNow; lastNow = now;
    loop.frame++;

    if (!global.OIKOS.state.paused) {
      acc += dt;
      var TICK = consts.TICK_MS;               // leitura viva (regra 5.8)
      var cap = consts.MAX_TICKS_PER_FRAME, n = 0;
      while (acc >= TICK && n < cap) { acc -= TICK; n++; tick(); }
      if (n >= cap) acc = 0;                   // teto atingido: descarta a dívida
    } else {
      acc = 0;                                 // pausa não acumula dívida
    }

    for (var i = 0; i < modules.length; i++) {
      var m = modules[i];
      if (!m.draw) continue;
      try { m.draw(dt); }
      catch (e) { console.error('[OIKOS] draw("' + m.name + '") lancou:', e); }
    }
  }

  var loop = {
    frame: 0,
    tickCount: 0,
    start: function () {
      if (started) return;                     // DECISÃO: start() idempotente
      started = true;
      for (var i = 0; i < modules.length; i++) initModule(modules[i]);
      lastNow = (global.performance && global.performance.now) ? global.performance.now() : Date.now();
      acc = 0;
      rafId = global.requestAnimationFrame(step);
    },
    // Regra 5.7: pause/resume são os ÚNICOS mutadores de state.paused.
    pause: function () { global.OIKOS.state.paused = true; },
    resume: function () { global.OIKOS.state.paused = false; acc = 0; },
    isPaused: function () { return global.OIKOS.state.paused === true; }
  };

  // ---------------------------------------------------------------------
  // Persistência — serializador recursivo ciente de TypedArrays.
  // ---------------------------------------------------------------------
  var TA = {
    Int8Array: Int8Array, Uint8Array: Uint8Array, Uint8ClampedArray: Uint8ClampedArray,
    Int16Array: Int16Array, Uint16Array: Uint16Array,
    Int32Array: Int32Array, Uint32Array: Uint32Array,
    Float32Array: Float32Array, Float64Array: Float64Array
  };

  function enc(v) {
    if (ArrayBuffer.isView(v) && !(v instanceof DataView)) {
      return { __ta: v.constructor.name, v: Array.prototype.slice.call(v) };
    }
    if (Array.isArray(v)) return v.map(enc);
    if (v && typeof v === 'object') {
      var o = {};
      for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) o[k] = enc(v[k]);
      return o;
    }
    return v;
  }
  function dec(v) {
    if (v && typeof v === 'object' && typeof v.__ta === 'string' && Array.isArray(v.v)) {
      var C = TA[v.__ta];
      if (!C) throw new Error('TypedArray desconhecido: ' + v.__ta);
      return C.from(v.v);
    }
    if (Array.isArray(v)) return v.map(dec);
    if (v && typeof v === 'object') {
      var o = {};
      for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) o[k] = dec(v[k]);
      return o;
    }
    return v;
  }

  function serialize(state) { return JSON.stringify(enc(state)); }

  function deserialize(json) {
    try {
      var raw = JSON.parse(json);
      if (!raw || typeof raw !== 'object') return null;
      if (raw.schemaVersion !== consts.SCHEMA_VERSION) return null;   // versão incompatível
      return dec(raw);
    } catch (e) { return null; }
  }

  // LACUNA: a spec exige localStorage, mas alguns navegadores o negam em
  // file://. Fallback em memória mantém save/load funcionais sem lançar.
  var memStore = Object.create(null);
  function store() {
    try {
      if (global.localStorage) { global.localStorage.getItem(consts.SAVE_KEY); return global.localStorage; }
    } catch (e) { /* bloqueado pelo navegador */ }
    return {
      getItem: function (k) { return (k in memStore) ? memStore[k] : null; },
      setItem: function (k, v) { memStore[k] = String(v); }
    };
  }

  function save() {
    try { store().setItem(consts.SAVE_KEY, serialize(global.OIKOS.state)); }
    catch (e) { console.error('[OIKOS] save falhou:', e); }
  }

  function load() {
    var json;
    try { json = store().getItem(consts.SAVE_KEY); }
    catch (e) { return false; }
    if (!json) return false;
    var st = deserialize(json);
    if (!st) return false;                       // estado vigente permanece intocado
    global.OIKOS.state = st;
    global.OIKOS.rng = makeRng(st.seed);         // regra 5.6: rng recriado da seed
    acc = 0;
    loop.pause();                                // regra 5.7: retoma PAUSADO
    return true;
  }

  // Regra 5.6: o rng NÃO é serializado. Após load(), os draws do stream
  // principal recomeçam da seed; o determinismo ESTRUTURAL se preserva
  // porque cada módulo usa rng.child('<label>'), derivado só da seed.
  // LACUNA: seed inicial de boot não especificada — constante fixa
  // (Math.random é proibido).
  var DEFAULT_SEED = 1337;

  function reset(newSeed) {
    // LACUNA: reset() sem argumento não foi especificado — reutiliza a seed atual.
    var s = (newSeed === undefined || newSeed === null)
      ? (global.OIKOS.state ? global.OIKOS.state.seed : DEFAULT_SEED)
      : newSeed;
    global.OIKOS.state = makeState(s);
    global.OIKOS.rng = makeRng(s);
    acc = 0;
  }

  global.OIKOS = {
    consts: consts,
    makeRng: makeRng,
    rng: makeRng(DEFAULT_SEED),
    state: makeState(DEFAULT_SEED),
    makeState: makeState,
    bus: bus,
    use: use,
    loop: loop,
    save: save,
    load: load,
    reset: reset,
    serialize: serialize,
    deserialize: deserialize
  };
})(window);
/* ===== OIKOS S1 KERNEL — FIM ===== */
</script>

<script>
/* ============== HARNESS DE ACEITE — 11 critérios (seção 6) ============== */
(function () {
  'use strict';
  var O = window.OIKOS;
  var results = [];
  function t(id, nome, ok, det) { results.push({ id: id, nome: nome, ok: !!ok, det: det || '' }); }
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  function draws(rng, n) { var a = []; for (var i = 0; i < n; i++) a.push(rng.f()); return a; }
  function sameArr(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  function deepEq(a, b) {
    if (a === b) return true;
    var aTA = ArrayBuffer.isView(a), bTA = ArrayBuffer.isView(b);
    if (aTA || bTA) {
      if (!aTA || !bTA || a.constructor !== b.constructor || a.length !== b.length) return false;
      for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    }
    if (Array.isArray(a) || Array.isArray(b)) {
      if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
      for (var j = 0; j < a.length; j++) if (!deepEq(a[j], b[j])) return false;
      return true;
    }
    if (a && b && typeof a === 'object' && typeof b === 'object') {
      var ka = Object.keys(a), kb = Object.keys(b);
      if (ka.length !== kb.length) return false;
      for (var k = 0; k < ka.length; k++) {
        if (!Object.prototype.hasOwnProperty.call(b, ka[k])) return false;
        if (!deepEq(a[ka[k]], b[ka[k]])) return false;
      }
      return true;
    }
    return false;
  }

  // ---- 1. Determinismo -------------------------------------------------
  (function () {
    var okMain = sameArr(draws(O.makeRng(42), 1000), draws(O.makeRng(42), 1000));
    var okChild = sameArr(draws(O.makeRng(42).child('elev'), 1000),
                          draws(O.makeRng(42).child('elev'), 1000));
    t(1, 'Determinismo: seed 42, 1000 draws (principal + child("elev"))',
      okMain && okChild, 'principal=' + okMain + ' child=' + okChild);
  })();

  // ---- 2. Range --------------------------------------------------------
  (function () {
    var r = O.makeRng(7), okF = true, okI = true;
    for (var i = 0; i < 10000; i++) {
      var f = r.f(); if (!(f >= 0 && f < 1)) okF = false;
      var n = r.i(7); if (!(Number.isInteger(n) && n >= 0 && n <= 6)) okI = false;
    }
    t(2, 'Range: 10000 draws .f() em [0,1) e .i(7) em {0..6}', okF && okI, 'f=' + okF + ' i=' + okI);
  })();

  // ---- 3. Streams derivados -------------------------------------------
  (function () {
    var base = O.makeRng(99);
    var a1 = draws(base.child('a'), 50);
    var b1 = draws(base.child('b'), 50);
    var a2 = draws(base.child('a'), 50);
    var difAB = !sameArr(a1, b1);
    var estavel = sameArr(a1, a2);
    var p1 = O.makeRng(99), semChild = draws(p1, 20);
    var p2 = O.makeRng(99); p2.child('x'); p2.child('y');
    var naoConsome = sameArr(semChild, draws(p2, 20));
    t(3, 'Streams derivados: a != b, a estável, child() não consome draws do pai',
      difAB && estavel && naoConsome,
      'a!=b=' + difAB + ' estavel=' + estavel + ' naoConsome=' + naoConsome);
  })();

  // ---- 4. Save/load roundtrip + schemaVersion inválido ------------------
  (function () {
    var N = O.consts.MAP * O.consts.MAP;
    function preencher(st) {
      for (var i = 0; i < N; i++) {
        st.tiles.terrain[i] = i % 8; st.tiles.resource[i] = i % 6;
        st.tiles.building[i] = (i * 3) % 256; st.tiles.level[i] = i % 5;
        st.tiles.owner[i] = i % 4; st.tiles.pollution[i] = (i % 100) / 100;
      }
      st.res.wood = 123;
      st.institutions.push({ id: 'conselho', yearAdopted: 12 });
      st.chronicle.push('fundacao');
      st.geo = { area: 42, coast: [1, 2, 3] };
      return st;
    }
    var st = preencher(O.makeState(5));
    var json = O.serialize(st);
    st.tiles.terrain.fill(255); st.tiles.pollution.fill(9);   // muta tudo depois
    st.res.wood = -1; st.institutions.length = 0;
    var back = O.deserialize(json);
    var tipos = !!back && back.tiles.terrain instanceof Uint8Array
      && back.tiles.pollution instanceof Float32Array
      && back.tiles.owner instanceof Uint8Array;
    var igual = deepEq(back, preencher(O.makeState(5)));

    var ref = O.state, ano = O.state.year, lancou = false, badNull = false, badLoad = true;
    try {
      badNull = (O.deserialize(JSON.stringify({ schemaVersion: 999, seed: 1 })) === null);
      try { window.localStorage.setItem(O.consts.SAVE_KEY, JSON.stringify({ schemaVersion: 999, seed: 1 })); }
      catch (e2) { O.consts.SAVE_KEY = 'oikos_v1'; }
      badLoad = O.load();
    } catch (e) { lancou = true; }
    var intocado = (O.state === ref && O.state.year === ano);
    t(4, 'Roundtrip serialize/deserialize com TypedArrays + schemaVersion 999 rejeitado sem corromper estado',
      tipos && igual && badNull && badLoad === false && !lancou && intocado,
      'tipos=' + tipos + ' deepEq=' + igual + ' desserNull=' + badNull +
      ' load=' + badLoad + ' intocado=' + intocado);
  })();

  // ---- 5. Regra 5.6 ----------------------------------------------------
  (function () {
    O.reset(42); var s1 = draws(O.rng.child('elev'), 200);
    O.reset(42); var s2 = draws(O.rng.child('elev'), 200);
    t(5, 'Regra 5.6: reset(42) 2x -> child("elev") idêntico (rng recriado da seed)', sameArr(s1, s2));
  })();

  // ---- 6. Bus ----------------------------------------------------------
  (function () {
    var ordem = [];
    var offA = O.bus.on('ui:toast', function () { ordem.push('A'); });
    O.bus.on('ui:toast', function () { throw new Error('[esperado] handler B falha de propósito'); });
    O.bus.on('ui:toast', function (p) { ordem.push('C:' + p.v); });
    O.bus.emit('ui:toast', { v: 1 });
    var fifo = (ordem.join(',') === 'A,C:1');
    offA();
    O.bus.emit('ui:toast', { v: 2 });
    var pos = (ordem.join(',') === 'A,C:1,C:2');
    t(6, 'Bus: FIFO, unsubscribe, exceção isolada (não bloqueia demais nem o próximo emit)',
      fifo && pos, ordem.join(','));
  })();

  // ---- módulos dummy (usados pelos testes 10 e 11) --------------------
  var ordemInit = [];
  var A = { init: 0, upd: 0, drw: 0 }, B = { init: 0, upd: 0, drw: 0 }, C = { init: 0, upd: 0, drw: 0 };
  var dtLog = [], quebras = 0;
  O.use('modA', {
    init: function () { ordemInit.push('A'); A.init++; },
    update: function () { A.upd++; },
    draw: function (dt) { A.drw++; dtLog.push(dt); }
  });
  O.use('modQuebrado', {                       // lança em init/update/draw (limitado)
    init: function () { ordemInit.push('Q'); throw new Error('[esperado] init quebrado'); },
    update: function () { if (quebras < 3) { quebras++; throw new Error('[esperado] update quebrado'); } },
    draw: function () { if (quebras < 3) throw new Error('[esperado] draw quebrado'); }
  });
  O.use('modB', {
    init: function () { ordemInit.push('B'); B.init++; },
    update: function () { B.upd++; },
    draw: function () { B.drw++; }
  });
  O.use('modC', {
    init: function () { ordemInit.push('C'); C.init++; },
    update: function () { C.upd++; },
    draw: function () { C.drw++; }
  });

  // ---- bateria assíncrona: 7, 8, 9, 10, 11 ----------------------------
  (async function run() {
    O.reset(42);
    O.consts.TICK_MS = 10;                     // regra 5.8: sobrescrito ANTES de start()
    var t0 = O.loop.tickCount;
    O.loop.start();
    var initOk = (ordemInit.join(',') === 'A,Q,B,C') && A.init === 1 && B.init === 1 && C.init === 1;

    var tardio = 0;                            // use() após start() -> init imediato
    O.use('modTardio', { init: function () { tardio++; } });
    var initTardio = (tardio === 1);

    // 7a: ~350 ms com TICK_MS=10
    var y0 = O.state.year;
    await sleep(350);
    var dTick = O.loop.tickCount - t0, dYear = O.state.year - y0;
    var ok7a = Math.abs(dTick - 35) <= 3 && dYear === dTick;

    // 7b/8a: pause congela ticks, frames continuam
    O.loop.pause();
    var ok8a = (O.state.paused === true && O.loop.isPaused() === true);
    var tP = O.loop.tickCount, fP = O.loop.frame;
    await sleep(120);
    var ok7b = (O.loop.tickCount === tP) && (O.loop.frame > fP);

    // 7c/8b: resume sem rajada de dívida
    O.loop.resume();
    var ok8b = (O.state.paused === false && O.loop.isPaused() === false);
    var tR = O.loop.tickCount;
    await sleep(60);
    var dR = O.loop.tickCount - tR;
    var ok7c = (dR > 0 && dR <= 10);

    t(7, 'Loop: TICK_MS=10 -> ~35 ticks em 350ms (+/-3), year acompanha, pause congela, resume sem rajada',
      ok7a && ok7b && ok7c,
      'ticks=' + dTick + ' year=' + dYear + ' congelou=' + ok7b + ' resumeDelta=' + dR);

    // 8c: após load() o loop fica pausado
    O.save();
    var okLoad = O.load();
    var ok8c = (okLoad === true && O.loop.isPaused() === true && O.state.paused === true);
    t(8, 'Regra 5.7: pause/resume espelham state.paused; isPaused()===state.paused; load() deixa pausado',
      ok8a && ok8b && ok8c, 'pause=' + ok8a + ' resume=' + ok8b + ' posLoad=' + ok8c);

    // 9: cadência viva (TICK_MS trocado em execução)
    O.loop.resume();
    var w1 = O.loop.tickCount; await sleep(400); var rapido = O.loop.tickCount - w1;
    O.consts.TICK_MS = 50;
    var w2 = O.loop.tickCount; await sleep(400); var lento = O.loop.tickCount - w2;
    t(9, 'Regra 5.8: consts.TICK_MS lido a cada uso -> cadência observada muda',
      rapido > lento * 2 && lento > 0,
      'TICK=10 -> ' + rapido + ' ticks · TICK=50 -> ' + lento + ' ticks');

    // 10: hooks dos módulos
    var okUpd = (A.upd === O.loop.tickCount && B.upd === O.loop.tickCount && C.upd === O.loop.tickCount);
    var okDrw = (A.drw === O.loop.frame && B.drw === O.loop.frame && C.drw === O.loop.frame);
    t(10, 'use() (regra 5.9): init em ordem de registro, update 1x/tick, draw 1x/frame, módulo que lança não bloqueia, init tardio',
      initOk && initTardio && okUpd && okDrw,
      'init=[' + ordemInit.join(',') + '] tardio=' + initTardio +
      ' upd=' + A.upd + '/' + O.loop.tickCount + ' drw=' + A.drw + '/' + O.loop.frame);

    // 11: performance — 120 frames sem frame > 50 ms
    var guard = 0;
    while (dtLog.length < 121 && guard < 400) { await sleep(16); guard++; }
    var amostra = dtLog.slice(1, 121);          // ignora o dt do 1o frame (arranque)
    var pior = 0;
    for (var i = 0; i < amostra.length; i++) if (amostra[i] > pior) pior = amostra[i];
    t(11, 'Performance: 120 frames do loop com módulos dummy, nenhum frame > 50 ms',
      amostra.length >= 120 && pior <= 50, 'frames=' + amostra.length + ' pior=' + pior.toFixed(1) + ' ms');

    O.loop.pause();
    render();
  })();

  function render() {
    results.sort(function (a, b) { return a.id - b.id; });
    var linhas = results.map(function (r) {
      return '<tr><td>' + r.id + '</td><td>' + r.nome + '</td><td class="' + (r.ok ? 'pass' : 'fail') +
        '">' + (r.ok ? 'PASS' : 'FAIL') + '</td><td class="det">' + r.det + '</td></tr>';
    }).join('');
    document.getElementById('saida').innerHTML =
      '<table><tr><th>#</th><th>Critério</th><th>Status</th><th>Detalhe</th></tr>' + linhas + '</table>';
    var pass = results.filter(function (r) { return r.ok; }).length;
    document.getElementById('resumo').innerHTML =
      '<b class="' + (pass === results.length ? 'pass' : 'fail') + '">' + pass + '/' + results.length + ' PASS</b>';
    console.table(results.map(function (r) {
      return { '#': r.id, criterio: r.nome, status: r.ok ? 'PASS' : 'FAIL', detalhe: r.det };
    }));
    console.log('OIKOS S1 harness: ' + pass + '/' + results.length + ' PASS');
  }
})();
</script>
