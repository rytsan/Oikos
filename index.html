<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OIKOS — crônicas da primeira casa</title>
<style>
  html,body{margin:0;height:100%;background:#14171c;color:#dfe4ea;
    font:13px/1.45 ui-monospace,Consolas,monospace;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="oikos"></canvas>
<script>
/* ===== OIKOS S1 KERNEL — INÍCIO ===== */
(function (global) {
  'use strict';

  // ---------------------------------------------------------------------
  // Constantes canônicas (CONTRATO entre os 13 módulos). Objeto mutável de
  // propósito: o integrador/harness pode sobrescrever TICK_MS ou SAVE_KEY
  // antes de start() e o loop lê os valores a cada uso (regra 5.8).
  // ---------------------------------------------------------------------
  var consts = {
    TILE_W: 64, TILE_H: 32,
    MAP: 56,
    TICK_MS: 2000,
    MAX_TICKS_PER_FRAME: 5,
    ZOOM_MIN: 0.5, ZOOM_MAX: 2.5,
    SAVE_KEY: 'oikos_v1',
    SCHEMA_VERSION: 1
  };

  // ---------------------------------------------------------------------
  // RNG determinístico — mulberry32 + derivação por hash xmur3.
  // NENHUM Math.random em todo o kernel.
  // ---------------------------------------------------------------------
  function xmur3(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // makeRng(seed) -> { seed, f(), i(n), pick(arr), child(label) }
  // DECISÃO: makeRng é exportado — a spec o descreve mas não o lista nas
  // chaves; os módulos precisam dele para criar streams locais.
  function makeRng(seed) {
    var s = seed >>> 0;
    var next = mulberry32(s);                  // estado interno privado
    return {
      seed: s,
      f: function () { return next(); },
      i: function (n) { return Math.floor(next() * n); },
      pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
      // child() deriva da SEED DE CONSTRUÇÃO, nunca do estado corrente: por
      // isso não consome draws do pai e é estável em qualquer momento.
      child: function (label) {
        var h = xmur3(String(label))();
        return makeRng((s ^ h) >>> 0);
      }
    };
  }

  // ---------------------------------------------------------------------
  // Estado central — schema v1 travado (seção 3 da spec).
  // ---------------------------------------------------------------------
  function makeState(seed) {
    var N = consts.MAP * consts.MAP;
    return {
      schemaVersion: consts.SCHEMA_VERSION,
      seed: seed >>> 0,
      year: 0, era: 0, paused: false,
      meters: { knowledge: 0, legitimacy: 50, harmonyAxis: 0 },
      res: { food: 0, wood: 0, stone: 0, copper: 0, iron: 0, coal: 0, gold: 0 },
      tiles: {
        terrain: new Uint8Array(N),
        resource: new Uint8Array(N),
        building: new Uint8Array(N),
        level: new Uint8Array(N),
        owner: new Uint8Array(N),
        pollution: new Float32Array(N)
      },
      geo: {},
      pendulums: {
        main: { u: 0, k: 0.1 }, harvest: { u: 0, k: 0.1 }, economy: { u: 0, k: 0.1 }
      },
      institutions: [],
      chronicle: [],
      clock: { stagnation: 0, decayStage: 0 },
      camera: { x: 0, y: 0, zoom: 1 },
      tool: null, hover: null,
      sim: { pop: 0, jobs: 0, foodProd: 0, housing: 0, tension: 0 }
    };
  }

  // ---------------------------------------------------------------------
  // Barramento de eventos — pub/sub SÍNCRONO, FIFO por ordem de registro.
  // Os nomes do dicionário (seção 5) não precisam de declaração prévia: o
  // bus aceita qualquer string. O kernel só emite 'sim:tick'.
  // ---------------------------------------------------------------------
  var handlers = Object.create(null);
  var bus = {
    on: function (evt, fn) {
      var arr = handlers[evt] || (handlers[evt] = []);
      arr.push(fn);
      return function off() { var i = arr.indexOf(fn); if (i >= 0) arr.splice(i, 1); };
    },
    emit: function (evt, payload) {
      var arr = handlers[evt];
      if (!arr || !arr.length) return;
      // DECISÃO: itera sobre cópia — on/off durante o emit não corrompe a volta.
      var snap = arr.slice();
      for (var i = 0; i < snap.length; i++) {
        try { snap[i](payload); }
        catch (e) { console.error('[OIKOS bus] handler de "' + evt + '" lancou:', e); }
      }
    }
  };

  // ---------------------------------------------------------------------
  // Registro de módulos (regra 5.9).
  // ---------------------------------------------------------------------
  var modules = [];
  var started = false;

  function initModule(m) {
    if (m.ready) return;
    m.ready = true;
    if (!m.init) return;
    try { m.init(); }
    catch (e) { console.error('[OIKOS] init("' + m.name + '") lancou:', e); }
  }

  function use(name, hooks) {
    hooks = hooks || {};
    var m = { name: name, init: hooks.init, update: hooks.update, draw: hooks.draw, ready: false };
    modules.push(m);
    if (started) initModule(m);                // use() após start(): init imediato
  }

  // ---------------------------------------------------------------------
  // Loop — rAF + tick fixo por acumulador.
  // ---------------------------------------------------------------------
  var rafId = 0, lastNow = 0, acc = 0;

  function tick() {
    loop.tickCount++;
    global.OIKOS.state.year++;                 // year++ ANTES do emit (regra 5.9)
    // DECISÃO: ordem do tick = year++ · update dos módulos · emit('sim:tick').
    for (var i = 0; i < modules.length; i++) {
      var m = modules[i];
      if (!m.update) continue;
      try { m.update(); }
      catch (e) { console.error('[OIKOS] update("' + m.name + '") lancou:', e); }
    }
    bus.emit('sim:tick', { year: global.OIKOS.state.year });
  }

  function step(now) {
    rafId = global.requestAnimationFrame(step);
    var dt = now - lastNow; lastNow = now;
    loop.frame++;

    if (!global.OIKOS.state.paused) {
      acc += dt;
      var TICK = consts.TICK_MS;               // leitura viva (regra 5.8)
      var cap = consts.MAX_TICKS_PER_FRAME, n = 0;
      while (acc >= TICK && n < cap) { acc -= TICK; n++; tick(); }
      if (n >= cap) acc = 0;                   // teto atingido: descarta a dívida
    } else {
      acc = 0;                                 // pausa não acumula dívida
    }

    for (var i = 0; i < modules.length; i++) {
      var m = modules[i];
      if (!m.draw) continue;
      try { m.draw(dt); }
      catch (e) { console.error('[OIKOS] draw("' + m.name + '") lancou:', e); }
    }
  }

  var loop = {
    frame: 0,
    tickCount: 0,
    start: function () {
      if (started) return;                     // DECISÃO: start() idempotente
      started = true;
      for (var i = 0; i < modules.length; i++) initModule(modules[i]);
      lastNow = (global.performance && global.performance.now) ? global.performance.now() : Date.now();
      acc = 0;
      rafId = global.requestAnimationFrame(step);
    },
    // Regra 5.7: pause/resume são os ÚNICOS mutadores de state.paused.
    pause: function () { global.OIKOS.state.paused = true; },
    resume: function () { global.OIKOS.state.paused = false; acc = 0; },
    isPaused: function () { return global.OIKOS.state.paused === true; }
  };

  // ---------------------------------------------------------------------
  // Persistência — serializador recursivo ciente de TypedArrays.
  // ---------------------------------------------------------------------
  var TA = {
    Int8Array: Int8Array, Uint8Array: Uint8Array, Uint8ClampedArray: Uint8ClampedArray,
    Int16Array: Int16Array, Uint16Array: Uint16Array,
    Int32Array: Int32Array, Uint32Array: Uint32Array,
    Float32Array: Float32Array, Float64Array: Float64Array
  };

  function enc(v) {
    if (ArrayBuffer.isView(v) && !(v instanceof DataView)) {
      return { __ta: v.constructor.name, v: Array.prototype.slice.call(v) };
    }
    if (Array.isArray(v)) return v.map(enc);
    if (v && typeof v === 'object') {
      var o = {};
      for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) o[k] = enc(v[k]);
      return o;
    }
    return v;
  }
  function dec(v) {
    if (v && typeof v === 'object' && typeof v.__ta === 'string' && Array.isArray(v.v)) {
      var C = TA[v.__ta];
      if (!C) throw new Error('TypedArray desconhecido: ' + v.__ta);
      return C.from(v.v);
    }
    if (Array.isArray(v)) return v.map(dec);
    if (v && typeof v === 'object') {
      var o = {};
      for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) o[k] = dec(v[k]);
      return o;
    }
    return v;
  }

  function serialize(state) { return JSON.stringify(enc(state)); }

  function deserialize(json) {
    try {
      var raw = JSON.parse(json);
      if (!raw || typeof raw !== 'object') return null;
      if (raw.schemaVersion !== consts.SCHEMA_VERSION) return null;   // versão incompatível
      return dec(raw);
    } catch (e) { return null; }
  }

  // LACUNA: a spec exige localStorage, mas alguns navegadores o negam em
  // file://. Fallback em memória mantém save/load funcionais sem lançar.
  var memStore = Object.create(null);
  function store() {
    try {
      if (global.localStorage) { global.localStorage.getItem(consts.SAVE_KEY); return global.localStorage; }
    } catch (e) { /* bloqueado pelo navegador */ }
    return {
      getItem: function (k) { return (k in memStore) ? memStore[k] : null; },
      setItem: function (k, v) { memStore[k] = String(v); }
    };
  }

  function save() {
    try { store().setItem(consts.SAVE_KEY, serialize(global.OIKOS.state)); }
    catch (e) { console.error('[OIKOS] save falhou:', e); }
  }

  function load() {
    var json;
    try { json = store().getItem(consts.SAVE_KEY); }
    catch (e) { return false; }
    if (!json) return false;
    var st = deserialize(json);
    if (!st) return false;                       // estado vigente permanece intocado
    global.OIKOS.state = st;
    global.OIKOS.rng = makeRng(st.seed);         // regra 5.6: rng recriado da seed
    acc = 0;
    loop.pause();                                // regra 5.7: retoma PAUSADO
    return true;
  }

  // Regra 5.6: o rng NÃO é serializado. Após load(), os draws do stream
  // principal recomeçam da seed; o determinismo ESTRUTURAL se preserva
  // porque cada módulo usa rng.child('<label>'), derivado só da seed.
  // LACUNA: seed inicial de boot não especificada — constante fixa
  // (Math.random é proibido).
  var DEFAULT_SEED = 1337;

  function reset(newSeed) {
    // LACUNA: reset() sem argumento não foi especificado — reutiliza a seed atual.
    var s = (newSeed === undefined || newSeed === null)
      ? (global.OIKOS.state ? global.OIKOS.state.seed : DEFAULT_SEED)
      : newSeed;
    global.OIKOS.state = makeState(s);
    global.OIKOS.rng = makeRng(s);
    acc = 0;
  }

  global.OIKOS = {
    consts: consts,
    makeRng: makeRng,
    rng: makeRng(DEFAULT_SEED),
    state: makeState(DEFAULT_SEED),
    makeState: makeState,
    bus: bus,
    use: use,
    loop: loop,
    save: save,
    load: load,
    reset: reset,
    serialize: serialize,
    deserialize: deserialize
  };
})(window);
/* ===== OIKOS S1 KERNEL — FIM ===== */
</script>
<script>
/* ===== OIKOS S2 WORLDGEN — INÍCIO ===== */
(function (global) {
  'use strict';
  var O = global.OIKOS;

  var OCEANO = 0, DOCE = 1, AREIA = 2, GRAMA = 3, FERTIL = 4, FLORESTA = 5, PEDRA = 6, MONTANHA = 7;
  var CACA = 1, PEIXE = 2, COBRE = 3, FERRO = 4, CARVAO = 5;

  // DECISÃO: faixa de borda forçada a oceano — o aceite exige perímetro 100%
  // marítimo em toda seed, e uma máscara radial folgada garante isso por
  // construção, sem depender de sorte do ruído.
  var MARGEM = 3;
  // Nível do mar ADAPTATIVO por quantil em vez de limiar fixo: o aceite
  // "terra >= 900" passa a ser estrutural, não estatístico.
  // Variabilidade (opção B da auditoria): o alvo de terra e a fração de floresta
  // são SORTEADOS por seed, dentro de faixas que preservam os aceites.
  // DECISÃO: o piso do alvo é 1010 e não 950 — o quantil é calculado ANTES de o
  // rio converter terra em água doce, e 60 tiles de folga mantêm o piso real
  // acima de 900 mesmo num rio longo, sem estourar o teto de 1350.
  var TERRA_MIN = 1010, TERRA_MAX = 1350;
  var FLORESTA_MIN = 0.12, FLORESTA_MAX = 0.26;

  function smooth(t) { return t * t * (3 - 2 * t); }

  function malha(rng, n) {
    var g = new Float32Array(n * n);
    for (var i = 0; i < g.length; i++) g[i] = rng.f();
    return { g: g, n: n };
  }

  // amostra bilinear com suavização e wrap toroidal
  function amostra(L, x, y) {
    var n = L.n, fx = x * n, fy = y * n;
    var ix = Math.floor(fx), iy = Math.floor(fy);
    var tx = smooth(fx - ix), ty = smooth(fy - iy);
    var x0 = ((ix % n) + n) % n, y0 = ((iy % n) + n) % n;
    var x1 = (x0 + 1) % n, y1 = (y0 + 1) % n;
    var topo = L.g[y0 * n + x0] + (L.g[y0 * n + x1] - L.g[y0 * n + x0]) * tx;
    var base = L.g[y1 * n + x0] + (L.g[y1 * n + x1] - L.g[y1 * n + x0]) * tx;
    return topo + (base - topo) * ty;
  }

  // fBm de 4 oitavas (malhas 4, 8, 16, 32), amplitude meio a meio
  function fbm(rng, oitavas, base) {
    var Ls = [], n = base;
    for (var i = 0; i < oitavas; i++) { Ls.push(malha(rng, n)); n *= 2; }
    return function (x, y) {
      var amp = 1, soma = 0, norma = 0;
      for (var j = 0; j < Ls.length; j++) { soma += amp * amostra(Ls[j], x, y); norma += amp; amp *= 0.5; }
      return soma / norma;
    };
  }

  // --- rio: descida greedy do pico ao mar -------------------------------
  function proximoLeito(T, e, M, cur, visto) {
    var cx = cur % M, cy = (cur - cx) / M, alvo = -1, menor = e[cur];
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      var nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= M || ny >= M) continue;
      var ni = ny * M + nx;
      if (T[ni] === OCEANO) return { mar: true, i: ni };
      if (visto[ni]) continue;
      if (e[ni] < menor) { menor = e[ni]; alvo = ni; }
    }
    return { mar: false, i: alvo };
  }

  function lago(T, M, cur) {
    var cx = cur % M, cy = (cur - cx) / M, n = 0;
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      var nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= M || ny >= M) continue;
      var ni = ny * M + nx;
      if (T[ni] !== OCEANO && T[ni] !== DOCE) { T[ni] = DOCE; n++; }
    }
    return n;
  }

  function cavarRio(T, e, M) {
    // nascente = ponto mais alto da montanha. Sem montanha não há nascente e a
    // ilha fica sem rio (hasRiver:false) — hidrelétricas somem do menu futuro.
    var pico = -1, melhor = -Infinity;
    for (var i = 0; i < T.length; i++) if (T[i] === MONTANHA && e[i] > melhor) { melhor = e[i]; pico = i; }
    if (pico < 0) return { len: 0, chegou: false };

    var cur = pico, len = 0, chegou = false, passos = 0;
    var visto = new Uint8Array(T.length);
    while (passos++ < T.length) {
      visto[cur] = 1;
      if (T[cur] !== OCEANO && T[cur] !== DOCE) { T[cur] = DOCE; len++; }
      var p = proximoLeito(T, e, M, cur, visto);
      if (p.mar) { chegou = true; break; }
      if (p.i < 0) { len += lago(T, M, cur); break; }   // depressão: vira lago
      cur = p.i;
    }
    return { len: len, chegou: chegou };
  }

  function perto(T, M, raio) {   // marca tiles a até `raio` passos de água doce
    var N = T.length, dist = new Uint8Array(N), fila = [];
    for (var i = 0; i < N; i++) if (T[i] === DOCE) { dist[i] = 1; fila.push(i); }
    for (var d = 1; d <= raio; d++) {
      var prox = [];
      for (var f = 0; f < fila.length; f++) {
        var cur = fila[f], cx = cur % M, cy = (cur - cx) / M;
        for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
          var nx = cx + dx, ny = cy + dy;
          if (nx < 0 || ny < 0 || nx >= M || ny >= M) continue;
          var ni = ny * M + nx;
          if (!dist[ni]) { dist[ni] = 1; prox.push(ni); }
        }
      }
      fila = prox;
    }
    return dist;
  }

  function temTerraAoLado(T, M, i) {
    var cx = i % M, cy = (i - cx) / M;
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      var nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= M || ny >= M) continue;
      if (T[ny * M + nx] >= AREIA) return true;
    }
    return false;
  }

  // generate() — determinística pela seed vigente. Escreve APENAS em
  // state.tiles.{terrain,resource} e em state.geo.
  function generate() {
    var st = O.state, M = O.consts.MAP, N = M * M;
    var T = st.tiles.terrain, R = st.tiles.resource;
    T.fill(OCEANO); R.fill(0);

    // 0. premissas da ilha, sorteadas por seed
    // LACUNA: a carta fixa os streams 'elev', 'fert', 'forest' e 'ore'. A opção B
    // da auditoria exige um sorteio de premissas por seed, então declaro o label
    // novo 'world' em vez de roubar draws de um stream de contrato.
    var rw = O.rng.child('world');
    var terraAlvo = TERRA_MIN + rw.i(TERRA_MAX - TERRA_MIN + 1);
    var florestaFrac = FLORESTA_MIN + rw.f() * (FLORESTA_MAX - FLORESTA_MIN);

    // 1. elevação: fBm 4 oitavas × máscara radial
    var ruidoE = fbm(O.rng.child('elev'), 4, 4);
    var e = new Float32Array(N);
    var c = (M - 1) / 2, raio = (M / 2) - MARGEM;
    for (var y = 0; y < M; y++) for (var x = 0; x < M; x++) {
      var dx = (x - c) / raio, dy = (y - c) / raio;
      var d = Math.sqrt(dx * dx + dy * dy);
      e[y * M + x] = d >= 1 ? 0 : ruidoE(x / M, y / M) * (1 - smooth(d));
    }

    // 2. nível do mar por quantil
    var ord = Float32Array.from(e); ord.sort();
    var alvo = Math.min(terraAlvo, N - 1);
    var mar = ord[N - alvo], maxE = ord[N - 1];
    if (!(mar > 0)) mar = 1e-6;                       // ilha degenerada
    if (!(maxE > mar)) maxE = mar + 1e-6;

    // 3. faixas de terreno por altura normalizada
    var alt = new Float32Array(N), i;
    for (i = 0; i < N; i++) {
      if (e[i] < mar || e[i] <= 0) continue;          // permanece oceano
      var h = (e[i] - mar) / (maxE - mar);
      alt[i] = h;
      T[i] = h < 0.10 ? AREIA : h < 0.70 ? GRAMA : h < 0.88 ? PEDRA : MONTANHA;
    }

    // 4. rio
    var rio = cavarRio(T, e, M);

    // 5. solo fértil: ruído próprio, amplificado na várzea do rio
    var ruidoF = fbm(O.rng.child('fert'), 4, 4);
    var varzea = perto(T, M, 2);
    for (i = 0; i < N; i++) {
      if (T[i] !== GRAMA) continue;
      var f = ruidoF((i % M) / M, Math.floor(i / M) / M) + (varzea[i] ? 0.22 : 0);
      if (f > 0.60) T[i] = FERTIL;
    }

    // 6. floresta: os K tiles de maior ruído entre grama e fértil
    var ruidoV = fbm(O.rng.child('forest'), 4, 4);
    var terra = 0, eleg = [], nota = new Float32Array(N);
    for (i = 0; i < N; i++) {
      if (T[i] >= AREIA) terra++;
      if (T[i] === GRAMA || T[i] === FERTIL) {
        eleg.push(i);
        nota[i] = ruidoV((i % M) / M, Math.floor(i / M) / M);
      }
    }
    eleg.sort(function (a, b) { return (nota[b] - nota[a]) || (a - b); });  // ordem total
    var kF = Math.min(eleg.length, Math.round(florestaFrac * terra));
    for (i = 0; i < kF; i++) T[eleg[i]] = FLORESTA;

    // 7. veios — só em rocha e montanha (emenda da auditoria): "ilha montanhosa
    // = ilha rica em minério" volta a ser premissa que varia entre partidas.
    // DECISÃO: o tipo é estratificado DENTRO da faixa mineira (altura relativa
    // a [0.70, 1.0]). Com os limiares absolutos de antes, todo veio cairia em
    // ferro e cobre/carvão desapareceriam do jogo.
    var ro = O.rng.child('ore');
    var mineral = [];
    for (i = 0; i < N; i++) if (T[i] === PEDRA || T[i] === MONTANHA) mineral.push(i);
    var veios = mineral.length ? 10 + ro.i(9) : 0, postos = 0;
    for (var v = 0; v < veios; v++) {
      var semente = ro.pick(mineral);
      var rel = (alt[semente] - 0.70) / 0.30;
      var tipo = rel < 0.35 ? COBRE : rel < 0.70 ? CARVAO : FERRO;
      var tam = 2 + ro.i(4), postosNoVeio = 0;
      var vx = semente % M, vy = (semente - vx) / M;
      for (var s = 0; s < tam; s++) {

  'use strict';
  var O = global.OIKOS;

  var lastState = null;   // identidade do estado em que o contador foi calculado
  var probes = [];        // SONDAS VOLÁTEIS: nunca entram no save

  // do objeto é o gatilho barato e suficiente para reidratar o contador a partir
  // do maior id presente na crônica restaurada.

    for (var i = 0; i < ch.length; i++) {
      var m = ch[i] && typeof ch[i].id === 'string' ? /^c(\d+)$/.exec(ch[i].id) : null;
      if (m) { var n = +m[1]; if (n > max) max = n; }
    }

  // console.error + null.
  // D25: valida APENAS type. titulo/prosa/ato/efeitoMedido/refs são do schema
  // (D23) mas seu conteúdo é responsabilidade do chamador — o módulo não limpa
  // culpa de quem chama.
  function log(entry) {
    sync();

      console.error('[OIKOS Chron] entrada inválida (type ausente ou fora do vocabulário):', entry);
      return null;
    }
    var e = {};
    for (var k in entry) if (Object.prototype.hasOwnProperty.call(entry, k)) e[k] = entry[k];
    if (e.refs !== undefined && !Array.isArray(e.refs)) e.refs = [e.refs];

        var porVinculo = e.ato !== undefined && e.ato === f.source;

    [138, 168, 72],  // 4 fértil
    [47, 90, 46],    // 5 floresta

  // ---------------------------------------------------------------------
  // EMENDA v1.9 D36: 'centrado' guarda a IDENTIDADE do estado já centrado, não
  // um booleano — reset() e load() reatribuem o objeto e a câmera precisa
  // voltar ao centro da ilha nova.
  var cv = null, ctx = null, ligado = false, centrado = null;
  var arrastando = false, ultimoX = 0, ultimoY = 0;

  function pegarCanvas() {
    if (ctx) return ctx;
    if (typeof document === 'undefined' || typeof document.createElement !== 'function') return null;
    cv = document.getElementById('oikos');
    if (!cv) {
      cv = document.createElement('canvas');
      cv.id = 'oikos';
      cv.width = 960; cv.height = 540;
      if (document.body) document.body.appendChild(cv);
    }
    if (typeof cv.getContext !== 'function') { cv = null; return null; }
    ctx = cv.getContext('2d');
    if (ctx && !ligado) ligarEntrada();
    return ctx;
  }

  function posNoCanvas(ev) {
    var r = (cv && cv.getBoundingClientRect) ? cv.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  function ligarEntrada() {
    ligado = true;
    cv.addEventListener('mousedown', function (ev) {
      arrastando = true;
      var p = posNoCanvas(ev); ultimoX = p.x; ultimoY = p.y;
    });
    global.addEventListener('mouseup', function () { arrastando = false; });
    cv.addEventListener('mousemove', function (ev) {
      var p = posNoCanvas(ev);
      if (arrastando) {
        O.state.camera.x += p.x - ultimoX;
        O.state.camera.y += p.y - ultimoY;
        ultimoX = p.x; ultimoY = p.y;
      }
      var t = unproject(p.x, p.y);
      O.state.hover = isZoneable(t.x, t.y) || dentro(t.x, t.y) ? { x: t.x, y: t.y } : null;
    });
    cv.addEventListener('mouseleave', function () { O.state.hover = null; });
    cv.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      var p = posNoCanvas(ev);
      camZoom(p.x, p.y, ev.deltaY < 0 ? 1.1 : 1 / 1.1);
    }, { passive: false });
  }

  function dentro(x, y) {
    var M = O.consts.MAP;
    return x >= 0 && y >= 0 && x < M && y < M;
  }

  // ---------------------------------------------------------------------
  // Desenho. Camadas: oceano de fundo → terreno → resource → fronteira →
  // edifícios por paintOrder → overlay de hover.
  // draw() altera SOMENTE camera e hover.
  // ---------------------------------------------------------------------
  function losango(g, px, py, hw, hh) {
    g.beginPath();
    g.moveTo(px, py - hh);
    g.lineTo(px + hw, py);
    g.lineTo(px, py + hh);
    g.lineTo(px - hw, py);
    g.closePath();
  }

  function corDaAgua(terr, i, bucket) {
    var p = clamp(O.state.tiles.pollution[i] || 0, 0, 1);
    if (p <= 0) return TABELA[terr][bucket];
    var b = BASE[terr];
    return hex(b[0] + (AGUA_SUJA[0] - b[0]) * p,
               b[1] + (AGUA_SUJA[1] - b[1]) * p,
               b[2] + (AGUA_SUJA[2] - b[2]) * p);
  }

  function draw(dt) {
    var g = pegarCanvas();
    if (!g) return;                     // sob Node não há canvas: no-op limpo

    var st = O.state, M = O.consts.MAP;
    var W = cv.width, H = cv.height;
    // EMENDA v1.9 D36: compara identidade, não flag booleana.
    if (centrado !== st) { centrarCamera(W, H); centrado = st; }

    var z = zoomVivo();
    st.camera.zoom = z;                 // clamp espelhado no estado
    var hw = HW() * z, hh = HH() * z;
    var bucket = garantirCache();
    var T = st.tiles.terrain, R = st.tiles.resource;
    var B = st.tiles.building, OWN = st.tiles.owner;

    // 1. oceano de fundo
    g.fillStyle = TABELA[0][3];
    g.fillRect(0, 0, W, H);

    var vis = visibleTiles(W, H);
    var i, k, x, y, p;

    // 2. terreno
    for (k = 0; k < vis.length; k++) {
      i = vis[k]; x = i % M; y = (i - x) / M;
      var terr = T[i];
      // EMENDA v1.9 D35: oceano poluído NÃO pode ser pulado. O retângulo de
      // fundo é mar limpo, e corDaAgua é quem interpola pollution[] — pular
      // terrain 0 deixava oceano sujo com cor de mar limpo.
      if (terr === 0 && !(st.tiles.pollution[i] > 0)) continue;
      p = project(x, y);
      g.fillStyle = (terr <= 1) ? corDaAgua(terr, i, bucket[i]) : TABELA[terr][bucket[i]];
      losango(g, p.x, p.y, hw, hh);
      g.fill();
    }

    // 3. marcadores de resource
    for (k = 0; k < vis.length; k++) {
      i = vis[k];
      if (!R[i]) continue;
      x = i % M; y = (i - x) / M;
      p = project(x, y);
      g.fillStyle = COR_RESOURCE[R[i]] || '#fff';
      g.beginPath();
      g.arc(p.x, p.y, Math.max(1.5, 3 * z), 0, Math.PI * 2);
      g.fill();
    }

    // 4. fronteira — contorno dos tiles com dono
    g.strokeStyle = 'rgba(240,225,160,0.75)';
    g.lineWidth = Math.max(1, z);
    for (k = 0; k < vis.length; k++) {
      i = vis[k];
      if (!OWN[i]) continue;
      x = i % M; y = (i - x) / M;
      p = project(x, y);
      losango(g, p.x, p.y, hw, hh);
      g.stroke();
    }

    // 5. edifícios na ordem do pintor (placeholder de caixa 3-tons)
    var ordem = paintOrder(vis);
    for (k = 0; k < ordem.length; k++) {
      i = ordem[k];
      if (!B[i]) continue;
      x = i % M; y = (i - x) / M;
      p = project(x, y);
      var alt = ALTURA_PREDIO * z * (1 + (st.tiles.level[i] || 0) * 0.5);
      g.fillStyle = '#8d7f6a';                                  // topo
      losango(g, p.x, p.y - alt, hw * 0.7, hh * 0.7);
      g.fill();
      g.fillStyle = '#6d6152';                                  // face esquerda
      g.beginPath();
      g.moveTo(p.x - hw * 0.7, p.y);
      g.lineTo(p.x, p.y + hh * 0.7);
      g.lineTo(p.x, p.y + hh * 0.7 - alt);
      g.lineTo(p.x - hw * 0.7, p.y - alt);
      g.closePath(); g.fill();
      g.fillStyle = '#574d41';                                  // face direita
      g.beginPath();
      g.moveTo(p.x + hw * 0.7, p.y);
      g.lineTo(p.x, p.y + hh * 0.7);
      g.lineTo(p.x, p.y + hh * 0.7 - alt);
      g.lineTo(p.x + hw * 0.7, p.y - alt);
      g.closePath(); g.fill();
    }

    // 6. overlay de hover — verde se zoneável, vermelho se não
    var hv = st.hover;
    if (hv && dentro(hv.x, hv.y)) {
      p = project(hv.x, hv.y);
      g.strokeStyle = isZoneable(hv.x, hv.y) ? 'rgba(120,240,120,0.95)' : 'rgba(240,110,110,0.95)';
      g.lineWidth = Math.max(1.5, 2 * z);
      losango(g, p.x, p.y, hw, hh);
      g.stroke();
    }
  }

  // Leitor puro: registra draw e NADA de update (a spec é explícita).
  O.use('Render', { draw: draw });

  O.Render = {
    draw: draw,
    project: project,
    unproject: unproject,
    isZoneable: isZoneable,
    paintOrder: paintOrder,
    visibleTiles: visibleTiles
  };
})(window);
/* ===== OIKOS S3 RENDER — FIM ===== */
</script>
<script>
/* ===== OIKOS S5 MODS — INÍCIO ===== */
(function (global) {
  'use strict';
  var O = global.OIKOS;

  // ---------------------------------------------------------------------
  // Estado do motor — CLOSURE VOLÁTIL (D28). O schema v1 não tem campo de
  // mods, então nada aqui é serializado. Fontes persistentes (instituições)
  // re-registram após load(), via S8.
  //
  // DECISÃO: NÃO limpo a closure ao detectar troca de identidade de state
  // (o gatilho que a S6 usa para reidratar ids). D28 atribui a re-registração
  // à S8, e re-push por id é idempotente — quem recarrega um save re-empurra
  // os mesmos ids e substitui no lugar. Limpar aqui duplicaria a
  // responsabilidade e apagaria mods de fontes que ainda não re-registraram.
  //
  // porAlvo: target -> array de mods em ORDEM DE PUSH (a "idade de adoção").
  // porId:   id -> mod, para o re-push substituir sem duplicar.
  // ---------------------------------------------------------------------
  var porAlvo = Object.create(null);
  var porId = Object.create(null);

  // EMENDA v1.10 D37: a closure ZERA quando o kernel reatribui o estado.
  // A D28 manda fontes persistentes re-registrarem após load — cláusula que só
  // faz sentido se o motor começa vazio, e a decisão anterior a tornava letra
  // morta. Sem zerar, instituições de uma partida anterior sobrevivem no save
  // carregado e alteram seus números em silêncio, sem que nada as remova.
  // Mesmo gatilho de identidade que a S6 usa para reidratar ids.
  var ultimoState = null;
  function sincronizar() {
    if (O.state === ultimoState) return;
    ultimoState = O.state;
    porAlvo = Object.create(null);
    porId = Object.create(null);
  }

  var KINDS = { add: 1, mult: 1 };

  function ehString(v) { return typeof v === 'string' && v.length > 0; }
  function finito(v) { return typeof v === 'number' && isFinite(v); }

  function listaDe(target) {
    return porAlvo[target] || (porAlvo[target] = []);
  }

  function tirarDaLista(m) {
    var l = porAlvo[m.target];
    if (!l) return;
    var i = l.indexOf(m);
    if (i >= 0) l.splice(i, 1);
  }

  // ---------------------------------------------------------------------
  // push — valida, insere ou SUBSTITUI NO LUGAR, emite 'mods:changed'.
  // Nunca lança; entrada inválida = console.error + null, SEM emitir.
  // ---------------------------------------------------------------------
  function push(cfg) {
    sincronizar();                                  // EMENDA v1.10 D37
    if (!cfg || typeof cfg !== 'object') {
      console.error('[OIKOS Mods] push inválido (não é objeto):', cfg);
      return null;
    }
    if (!ehString(cfg.id) || !ehString(cfg.source) || !ehString(cfg.target)) {
      console.error('[OIKOS Mods] push inválido (id/source/target têm de ser strings):', cfg);
      return null;
    }
    if (!KINDS[cfg.kind]) {
      console.error('[OIKOS Mods] push inválido (kind fora de {add, mult}):', cfg);
      return null;
    }
    var temFn = typeof cfg.fn === 'function';
    if (!temFn && !finito(cfg.value)) {
      console.error('[OIKOS Mods] push inválido (value finito OU fn função):', cfg);
      return null;
    }

    // DECISÃO: expiresAt não consta da lista de validações da carta. Aceito
    // qualquer valor; não-finito vale como AUSENTE, ou seja, permanente.
    var expira = finito(cfg.expiresAt) ? cfg.expiresAt : undefined;

    var velho = porId[cfg.id];
    if (velho) {
      // Reforma NÃO reordena precedência: o mod é editado no lugar e mantém
      // a posição que já ocupava na fila do alvo.
      // DECISÃO: se o target mudou, não há posição a preservar na lista nova —
      // sai da antiga e entra no fim da nova.
      // EMENDA v1.10 D38: quem mantinha cache do alvo ANTIGO também precisa
      // saber que ele mudou — sem isto, só o alvo novo era notificado.
      var alvoAntigo = velho.target;
      if (velho.target !== cfg.target) {
        tirarDaLista(velho);
        velho.target = cfg.target;
        listaDe(cfg.target).push(velho);
      }
      velho.source = cfg.source;
      velho.kind = cfg.kind;
      velho.value = temFn ? undefined : Number(cfg.value);
      velho.fn = temFn ? cfg.fn : undefined;
      velho.expiresAt = expira;
      O.bus.emit('mods:changed', { target: velho.target });
      if (alvoAntigo !== velho.target) O.bus.emit('mods:changed', { target: alvoAntigo });
      return velho;
    }

    var m = {
      id: cfg.id, source: cfg.source, target: cfg.target, kind: cfg.kind,
      value: temFn ? undefined : Number(cfg.value),
      fn: temFn ? cfg.fn : undefined,
      expiresAt: expira
    };
    porId[m.id] = m;
    listaDe(m.target).push(m);
    O.bus.emit('mods:changed', { target: m.target });
    return m;
  }

  // ---------------------------------------------------------------------
  // lazy-sweep — expira por ANO DE JOGO, lido vivo de OIKOS.state.year.
  // Roda dentro do get, sobre a lista do alvo pedido apenas.
  // ---------------------------------------------------------------------
  function varrer(lista) {
    var ano = O.state.year, i, m;
    for (i = lista.length - 1; i >= 0; i--) {
      m = lista[i];
      if (m.expiresAt !== undefined && m.expiresAt <= ano) {
        lista.splice(i, 1);
        delete porId[m.id];
      }
    }
  }

  // valor de um mod no momento do get. fn é avaliada A CADA get — é o que
  // torna as decisões sensíveis a contexto. Retorno não-finito: console.error
  // e o mod é IGNORADO (não derruba o cálculo inteiro).
  function valorDe(m, snapshot) {
    if (!m.fn) return m.value;
    var v;
    try { v = m.fn(snapshot); }
    catch (e) {
      console.error('[OIKOS Mods] fn de "' + m.id + '" lancou:', e);
      return null;
    }
    if (!finito(v)) {
      console.error('[OIKOS Mods] fn de "' + m.id + '" devolveu não-finito:', v);
      return null;
    }
    return v;
  }

  // ---------------------------------------------------------------------
  // get(target, snapshot?) — nunca lança, nunca muta a base.
  //
  // LACUNA: a carta exige que "motor vazio devolve o valor base", mas a
  // assinatura get(target, snapshot?) não traz parâmetro de base. Escolho a
  // leitura mais simples que satisfaz o aceite sem inventar parâmetro: a base
  // é snapshot[target] quando for número finito, e 0 quando não houver
  // snapshot ou a chave. O mesmo snapshot vai para fn(snapshot), e o objeto
  // NUNCA é escrito. Se o dono preferir base explícita, é troca de assinatura
  // na carta, não aqui.
  //
  // Ordem (D28): TODOS os 'add' por idade de adoção, DEPOIS todos os 'mult'
  // por idade. Duas passadas sobre a mesma lista em ordem de push — sem
  // alocar arrays intermediários, o que mantém o get dentro do orçamento.
  // ---------------------------------------------------------------------
  function get(target, snapshot) {
    try {
      sincronizar();                                // EMENDA v1.10 D37
      var base = (snapshot && finito(snapshot[target])) ? snapshot[target] : 0;
      if (!ehString(target)) return base;
      var lista = porAlvo[target];
      if (!lista || !lista.length) return base;

      varrer(lista);

      var r = base, i, m, v;
      for (i = 0; i < lista.length; i++) {
        m = lista[i];
        if (m.kind !== 'add') continue;
        v = valorDe(m, snapshot);
        if (v !== null) r += v;
      }
      for (i = 0; i < lista.length; i++) {
        m = lista[i];
        if (m.kind !== 'mult') continue;
        v = valorDe(m, snapshot);
        if (v !== null) r *= v;
      }
      return finito(r) ? r : base;
    } catch (e) {
      console.error('[OIKOS Mods] get("' + target + '") lancou:', e);
      return 0;
    }
  }

  // ---------------------------------------------------------------------
  // removeBySource — devolve a contagem removida.
  // DECISÃO: emite um 'mods:changed' por ALVO distinto afetado, com o mesmo
  // payload {target} do push. Manter uma única forma de payload vale mais
  // para quem escuta (invalidar cache por alvo) do que um evento só com
  // {source}, que obrigaria o ouvinte a tratar dois formatos.
  // ---------------------------------------------------------------------
  function removeBySource(sourceId) {
    sincronizar();                                  // EMENDA v1.10 D37
    if (!ehString(sourceId)) {
      console.error('[OIKOS Mods] removeBySource inválido (source tem de ser string):', sourceId);
      return 0;
    }
    var n = 0, alvos = [];
    for (var target in porAlvo) {
      var lista = porAlvo[target], mexeu = false;
      for (var i = lista.length - 1; i >= 0; i--) {
        if (lista[i].source !== sourceId) continue;
        delete porId[lista[i].id];
        lista.splice(i, 1);
        n++; mexeu = true;
      }
      if (mexeu) alvos.push(target);
    }
    for (var k = 0; k < alvos.length; k++) O.bus.emit('mods:changed', { target: alvos[k] });
    return n;
  }

  // Biblioteca pura: sem OIKOS.use(), sem hook de ciclo de vida, sem escrita
  // em state, zero DOM.
  O.Mods = { push: push, get: get, removeBySource: removeBySource };
})(window);
/* ===== OIKOS S5 MODS — FIM ===== */
</script>
<script>
// Arranque mínimo: dimensiona o canvas à janela, gera a ilha e sobe o loop.
// Guardado para o NAVEGADOR: sob Node (smoke do integrador) não há canvas nem
// addEventListener, e start() agendaria rAF para sempre, travando o processo.
(function () {
  if (typeof document === 'undefined' || typeof document.createElement !== 'function') return;
  var cv = document.getElementById('oikos');
  function medir() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  medir();
  window.addEventListener('resize', medir);
  OIKOS.reset(42);
  OIKOS.Worldgen.generate();
  OIKOS.loop.start();
})();
</script>
</body>
</html>
